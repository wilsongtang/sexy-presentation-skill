<!--
  icons.html
  Reusable icon patterns for presentation slides.
  All sizing and color values use CSS custom properties for theme compatibility.
-->

<!-- ============================================================ -->
<!-- Component: icon-circle-48                                     -->
<!-- Icon centered inside a 48px circle with accent background    -->
<!-- ============================================================ -->
<!-- Component: icon-circle-48 -->
<div style="
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--color-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
">
  <!-- Replace with <img>, <svg>, or emoji -->
  <span style="
    color: var(--color-on-accent, #ffffff);
    font-size: 22px;
    line-height: 1;
  ">★</span>
</div>

<!-- ============================================================ -->
<!-- Component: icon-label-horizontal                              -->
<!-- Icon circle (48px) paired with a label, arranged in a row    -->
<!-- ============================================================ -->
<!-- Component: icon-label-horizontal -->
<div style="
  display: flex;
  align-items: center;
  gap: var(--gap-sm, 12px);
">
  <div style="
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--color-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  ">
    <span style="
      color: var(--color-on-accent, #ffffff);
      font-size: 22px;
      line-height: 1;
    ">★</span>
  </div>
  <span style="
    color: var(--color-text);
    font-size: var(--size-body, 1rem);
    font-weight: 600;
    line-height: 1.3;
  ">Icon Label</span>
</div>

<!-- Component: emoji-icon-wrapper                                 -->
<!-- Wraps an emoji in a consistently sized, vertically centered  -->
<!-- container so emoji icons behave like other icon types        -->
<!-- ============================================================ -->
<!-- Component: emoji-icon-wrapper -->
<div style="
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--size-icon, 48px);
  height: var(--size-icon, 48px);
  font-size: calc(var(--size-icon, 48px) * 0.55);
  line-height: 1;
  user-select: none;
  flex-shrink: 0;
">
  <!-- Replace with any emoji -->
  🚀
</div>

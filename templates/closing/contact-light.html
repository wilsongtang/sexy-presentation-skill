<!-- Template: closing-contact-light -->
<!-- Slots: title, name, email, phone, website -->
<!-- Composition: Card Grid | Intensity: workhorse -->
<div class="slide" style="position: relative; overflow: hidden;">
  <!-- Motif: bottom-right dot -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div style="display: flex; flex-direction: row; gap: var(--gap); flex: 1; align-items: stretch;">
    <!-- Dominant card: name — accent border -->
    <div style="flex: 1.15; border: 2px solid var(--color-accent); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px; justify-content: center;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.15;"></div>
      <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body);">Name</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text);">{{name}}</p>
    </div>

    <!-- Email card -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px; justify-content: center;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.08; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--size-body); color: var(--color-accent);">&#x2709;</span>
      </div>
      <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body);">Email</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text);">{{email}}</p>
    </div>

    <!-- Phone card -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px; justify-content: center;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.08; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--size-body); color: var(--color-accent);">&#x2706;</span>
      </div>
      <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body);">Phone</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text);">{{phone}}</p>
    </div>

    <!-- Website card -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px; justify-content: center;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.08; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--size-body); color: var(--color-accent);">&#x2609;</span>
      </div>
      <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body);">Website</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text);">{{website}}</p>
    </div>
  </div>
</div>

<!-- Template: closing-cta-light -->
<!-- Slots: cta_title, cta_description, cta_button_label, cta_supporting_text -->
<div class="slide items-center justify-center text-center" style="position: relative; overflow: hidden;">
  <!-- Subtle corner accent shapes -->
  <div style="position: absolute; top: -80px; right: -80px; width: 320px; height: 320px; border-radius: 50%; background: var(--color-accent); opacity: 0.06; pointer-events: none;"></div>
  <div style="position: absolute; bottom: -80px; left: -80px; width: 320px; height: 320px; border-radius: 50%; background: var(--color-secondary); opacity: 0.1; pointer-events: none;"></div>

  <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) * 1.1); max-width: 1100px;">
    <!-- Title -->
    <h1 style="font-family: var(--font-header); font-size: var(--size-title); font-weight: 700; color: var(--color-text); letter-spacing: -0.025em; line-height: 1.1;">
      {{cta_title}}
    </h1>

    <!-- Description -->
    <p style="font-family: var(--font-body); font-size: var(--size-body); color: var(--color-muted); max-width: 900px; line-height: var(--line-height);">
      {{cta_description}}
    </p>

    <!-- CTA Button -->
    <div style="background: var(--color-accent); border-radius: 12px; padding: 24px 72px; margin-top: calc(var(--gap) * 0.4);">
      <span style="font-family: var(--font-header); font-size: var(--size-body); font-weight: 700; color: var(--color-text-reversed); letter-spacing: 0.02em;">
        {{cta_button_label}}
      </span>
    </div>

    <!-- Supporting text -->
    <p style="font-family: var(--font-body); font-size: var(--size-caption); color: var(--color-muted); max-width: 700px; line-height: var(--line-height);">
      {{cta_supporting_text}}
    </p>
  </div>
</div>

<!-- Template: closing-qr-code-light -->
<!-- Slots: title, qr_image, url -->
<!-- Composition: Centered Hero | Intensity: impact -->
<div class="slide items-center justify-center text-center" style="position: relative; overflow: hidden;">
  <!-- Motif: bottom rule for grounding -->
  <div class="motif-element motif-rule" style="position: absolute; bottom: calc(var(--margin) * 2); left: 50%; transform: translateX(-50%);"></div>
  <!-- Motif: top-right dot for balance -->
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: calc(var(--margin) + 40px);"></div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) * 1.5); padding-bottom: calc(var(--margin) * 0.5);">
    <!-- Title above QR -->
    <h2 style="font-size: var(--size-title); font-family: var(--font-header); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: var(--color-text);">
      {{title}}
    </h2>

    <!-- QR image — NOT wrapped in .img-treatment -->
    <img src="{{qr_image}}" alt="QR code" style="max-width: 300px; width: 100%; height: auto; border-radius: 8px;" />

    <!-- URL below QR at caption size, muted -->
    <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body); letter-spacing: 0.01em;">
      {{url}}
    </p>
  </div>
</div>

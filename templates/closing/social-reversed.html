<!-- Template: closing-social-reversed -->
<!-- Slots: title, platform_1, handle_1, platform_2, handle_2, platform_3, handle_3, platform_4, handle_4 -->
<!-- Composition: Card Grid | Intensity: workhorse -->
<div class="slide" style="background-color: var(--color-primary); position: relative; overflow: hidden;">
  <!-- Motif: bottom-right dot -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text-reversed); margin-bottom: var(--gap);">{{title}}</h2>

  <!-- Horizontal row of social cards -->
  <div style="display: flex; flex-direction: row; gap: var(--gap); flex: 1; align-items: stretch;">
    <!-- Dominant card: first platform — accent border -->
    <div style="flex: 1.15; border: 2px solid var(--color-accent); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 12px; justify-content: center;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.15;"></div>
      <p style="font-size: var(--size-caption); font-weight: 600; font-family: var(--font-header); color: var(--color-accent);">{{platform_1}}</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text-reversed);">{{handle_1}}</p>
    </div>

    <!-- Card 2 -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 12px; justify-content: center;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.08;"></div>
      <p style="font-size: var(--size-caption); font-weight: 600; font-family: var(--font-header); color: rgba(255,255,255,0.6);">{{platform_2}}</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text-reversed);">{{handle_2}}</p>
    </div>

    <!-- Card 3 -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 12px; justify-content: center;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.08;"></div>
      <p style="font-size: var(--size-caption); font-weight: 600; font-family: var(--font-header); color: rgba(255,255,255,0.6);">{{platform_3}}</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text-reversed);">{{handle_3}}</p>
    </div>

    <!-- Card 4 -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 12px; justify-content: center;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.08;"></div>
      <p style="font-size: var(--size-caption); font-weight: 600; font-family: var(--font-header); color: rgba(255,255,255,0.6);">{{platform_4}}</p>
      <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text-reversed);">{{handle_4}}</p>
    </div>
  </div>
</div>

<!-- Template: closing-qr-code-reversed -->
<!-- Slots: title, qr_url, qr_caption -->
<div class="slide items-center justify-center text-center" style="background-color: var(--color-primary); position: relative; overflow: hidden;">
  <!-- Subtle corner decorations -->
  <div style="position: absolute; top: calc(var(--margin) - 10px); left: calc(var(--margin) - 10px); width: 80px; height: 80px; border-top: 3px solid var(--color-accent); border-left: 3px solid var(--color-accent); border-radius: 4px;"></div>
  <div style="position: absolute; top: calc(var(--margin) - 10px); right: calc(var(--margin) - 10px); width: 80px; height: 80px; border-top: 3px solid var(--color-accent); border-right: 3px solid var(--color-accent); border-radius: 4px;"></div>
  <div style="position: absolute; bottom: calc(var(--margin) - 10px); left: calc(var(--margin) - 10px); width: 80px; height: 80px; border-bottom: 3px solid var(--color-accent); border-left: 3px solid var(--color-accent); border-radius: 4px;"></div>
  <div style="position: absolute; bottom: calc(var(--margin) - 10px); right: calc(var(--margin) - 10px); width: 80px; height: 80px; border-bottom: 3px solid var(--color-accent); border-right: 3px solid var(--color-accent); border-radius: 4px;"></div>

  <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: var(--gap);">
    <!-- Title -->
    <h2 style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 600; color: var(--color-text-reversed);">{{title}}</h2>

    <!-- QR code placeholder (bordered square) -->
    <div style="width: 400px; height: 400px; border: 3px solid var(--color-border); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: white; box-shadow: 0 4px 24px rgba(0,0,0,0.06);">
      <!-- Mock QR grid pattern -->
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 24px;">
        <!-- Simulated QR-like pattern using accent and muted colored squares -->
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-accent);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:var(--color-accent);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
        <div style="width:36px;height:36px;background:transparent;"></div>
        <div style="width:36px;height:36px;background:var(--color-text-reversed);border-radius:4px;"></div>
      </div>
      <p style="font-size: 18px; color: rgba(255,255,255,0.6); font-family: var(--font-body); padding: 0 16px 16px;">Scan to visit</p>
    </div>

    <!-- URL text -->
    <p style="font-family: var(--font-body); font-size: var(--size-body); color: var(--color-accent); font-weight: 500; letter-spacing: 0.01em;">{{qr_url}}</p>
    <p style="font-family: var(--font-body); font-size: var(--size-caption); color: rgba(255,255,255,0.6);">{{qr_caption}}</p>
  </div>
</div>

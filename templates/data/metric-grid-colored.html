<!-- Template: data-metric-grid-colored -->
<!-- Slots: title, metric_1_value, metric_1_label, metric_2_value, metric_2_label, metric_3_value, metric_3_label, metric_4_value, metric_4_label -->
<!-- Composition: Card Grid | Intensity: workhorse -->
<div class="slide" style="background-color: var(--color-secondary); position: relative; overflow: hidden;">
  <!-- Motif: dot at bottom-right -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <h2 style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); flex: 1; align-content: stretch;">

    <!-- Metric 1: dominant card — accent border -->
    <div style="flex: 1.15; border: 2px solid var(--color-accent); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.15;"></div>
      <div style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 800; color: var(--color-accent); line-height: 1; letter-spacing: -1px;">
        {{metric_1_value}}
      </div>
      <div style="font-size: var(--size-caption); color: var(--color-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;">
        {{metric_1_label}}
      </div>
    </div>

    <!-- Metric 2: supporting card -->
    <div style="border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.08;"></div>
      <div style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 800; color: var(--color-text); line-height: 1; letter-spacing: -1px;">
        {{metric_2_value}}
      </div>
      <div style="font-size: var(--size-caption); color: var(--color-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;">
        {{metric_2_label}}
      </div>
    </div>

    <!-- Metric 3: supporting card -->
    <div style="border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.08;"></div>
      <div style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 800; color: var(--color-text); line-height: 1; letter-spacing: -1px;">
        {{metric_3_value}}
      </div>
      <div style="font-size: var(--size-caption); color: var(--color-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;">
        {{metric_3_label}}
      </div>
    </div>

    <!-- Metric 4: supporting card -->
    <div style="border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-accent); opacity: 0.08;"></div>
      <div style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 800; color: var(--color-text); line-height: 1; letter-spacing: -1px;">
        {{metric_4_value}}
      </div>
      <div style="font-size: var(--size-caption); color: var(--color-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;">
        {{metric_4_label}}
      </div>
    </div>

  </div>
</div>

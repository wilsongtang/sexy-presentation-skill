<!-- Template: data-big-stat-single-reversed -->
<!-- Slots: stat_number, stat_label, stat_context -->
<div class="slide" style="background-color: var(--color-primary); justify-content: center; align-items: center; text-align: center;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
    <div style="font-family: var(--font-header); font-size: clamp(60pt, 6vw, 72pt); font-weight: 800; line-height: 1; color: var(--color-accent); letter-spacing: -2px;">
      {{stat_number}}
    </div>
    <div style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 600; color: var(--color-text-reversed); letter-spacing: 0.02em;">
      {{stat_label}}
    </div>
    <div style="font-size: var(--size-body); color: rgba(255,255,255,0.6); max-width: 800px; line-height: var(--line-height);">
      {{stat_context}}
    </div>
  </div>
</div>

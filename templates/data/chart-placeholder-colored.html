<!-- Template: data-chart-placeholder-colored -->
<!-- Slots: title, chart_description -->
<!-- Composition: Magazine Flow | Intensity: workhorse -->
<div class="slide" style="background-color: var(--color-secondary); position: relative; overflow: hidden;">
  <!-- Motif: dot at bottom-right -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <h2 style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; gap: var(--gap);">

    <!-- Chart placeholder area: 70% of slide height via flex -->
    <div style="flex: 7; border: 2px dashed var(--color-border); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: transparent; position: relative;">
      <!-- Corner tick marks for chart feel -->
      <div style="position: absolute; top: 20px; left: 20px; width: 24px; height: 24px; border-top: 2px solid var(--color-border); border-left: 2px solid var(--color-border); border-radius: 2px;"></div>
      <div style="position: absolute; top: 20px; right: 20px; width: 24px; height: 24px; border-top: 2px solid var(--color-border); border-right: 2px solid var(--color-border); border-radius: 2px;"></div>
      <div style="position: absolute; bottom: 20px; left: 20px; width: 24px; height: 24px; border-bottom: 2px solid var(--color-border); border-left: 2px solid var(--color-border); border-radius: 2px;"></div>
      <div style="position: absolute; bottom: 20px; right: 20px; width: 24px; height: 24px; border-bottom: 2px solid var(--color-border); border-right: 2px solid var(--color-border); border-radius: 2px;"></div>

      <!-- Chart icon placeholder -->
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" style="opacity: 0.2;">
        <rect x="4" y="36" width="12" height="24" rx="3" fill="var(--color-accent)"/>
        <rect x="22" y="20" width="12" height="40" rx="3" fill="var(--color-accent)"/>
        <rect x="40" y="10" width="12" height="50" rx="3" fill="var(--color-accent)"/>
        <line x1="2" y1="61" x2="62" y2="61" stroke="var(--color-muted)" stroke-width="2"/>
      </svg>
      <div style="font-size: var(--size-body); color: var(--color-muted); font-weight: 500; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.08em;">CHART AREA</div>
    </div>

    <!-- Description below at --size-caption, flex: 3 to keep chart dominant at ~70% -->
    <div style="flex: 3; display: flex; align-items: flex-start; padding-top: 8px;">
      <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height); max-width: 900px;">
        {{chart_description}}
      </p>
    </div>

  </div>
</div>

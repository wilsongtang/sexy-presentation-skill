<!-- Template: data-percentage-ring-colored -->
<!-- Slots: title, subtitle, ring_1_pct, ring_1_label, ring_1_description, ring_2_pct, ring_2_label, ring_2_description, ring_3_pct, ring_3_label, ring_3_description -->
<!-- ring_*_pct is a number 0–100. The SVG stroke-dashoffset is calculated as: circumference * (1 - pct/100). Circumference for r=90 is ~565.5 -->
<div class="slide" style="background-color: var(--color-secondary);">
  <div style="margin-bottom: var(--gap);">
    <h2 style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 600;">{{title}}</h2>
    <p style="font-size: var(--size-body); color: var(--color-muted); margin-top: 8px;">{{subtitle}}</p>
  </div>

  <div class="flex flex-row" style="flex: 1; align-items: center; justify-content: space-around; gap: var(--gap);">

    <!-- Ring 1 -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; flex: 1;">
      <div style="position: relative; width: 240px; height: 240px; flex-shrink: 0;">
        <svg width="240" height="240" viewBox="0 0 240 240" style="transform: rotate(-90deg);">
          <!-- Track circle -->
          <circle cx="120" cy="120" r="90"
            fill="none"
            stroke="var(--color-border)"
            stroke-width="18"/>
          <!-- Progress circle: dasharray=565.5, dashoffset = 565.5*(1-pct/100) -->
          <circle cx="120" cy="120" r="90"
            fill="none"
            stroke="var(--color-accent)"
            stroke-width="18"
            stroke-linecap="round"
            stroke-dasharray="565.5"
            stroke-dashoffset="{{ring_1_dashoffset}}"/>
        </svg>
        <!-- Centered percentage label -->
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 800; color: var(--color-text); line-height: 1;">
            {{ring_1_pct}}%
          </span>
        </div>
      </div>
      <div style="text-align: center; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-family: var(--font-header); font-size: var(--size-body); font-weight: 600; color: var(--color-text);">{{ring_1_label}}</div>
        <div style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height); max-width: 320px;">{{ring_1_description}}</div>
      </div>
    </div>

    <!-- Ring 2 -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; flex: 1;">
      <div style="position: relative; width: 240px; height: 240px; flex-shrink: 0;">
        <svg width="240" height="240" viewBox="0 0 240 240" style="transform: rotate(-90deg);">
          <circle cx="120" cy="120" r="90"
            fill="none"
            stroke="var(--color-border)"
            stroke-width="18"/>
          <circle cx="120" cy="120" r="90"
            fill="none"
            stroke="var(--color-accent)"
            stroke-width="18"
            stroke-linecap="round"
            stroke-dasharray="565.5"
            stroke-dashoffset="{{ring_2_dashoffset}}"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 800; color: var(--color-text); line-height: 1;">
            {{ring_2_pct}}%
          </span>
        </div>
      </div>
      <div style="text-align: center; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-family: var(--font-header); font-size: var(--size-body); font-weight: 600; color: var(--color-text);">{{ring_2_label}}</div>
        <div style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height); max-width: 320px;">{{ring_2_description}}</div>
      </div>
    </div>

    <!-- Ring 3 -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; flex: 1;">
      <div style="position: relative; width: 240px; height: 240px; flex-shrink: 0;">
        <svg width="240" height="240" viewBox="0 0 240 240" style="transform: rotate(-90deg);">
          <circle cx="120" cy="120" r="90"
            fill="none"
            stroke="var(--color-border)"
            stroke-width="18"/>
          <circle cx="120" cy="120" r="90"
            fill="none"
            stroke="var(--color-accent)"
            stroke-width="18"
            stroke-linecap="round"
            stroke-dasharray="565.5"
            stroke-dashoffset="{{ring_3_dashoffset}}"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 800; color: var(--color-text); line-height: 1;">
            {{ring_3_pct}}%
          </span>
        </div>
      </div>
      <div style="text-align: center; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-family: var(--font-header); font-size: var(--size-body); font-weight: 600; color: var(--color-text);">{{ring_3_label}}</div>
        <div style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height); max-width: 320px;">{{ring_3_description}}</div>
      </div>
    </div>

  </div>
</div>

<!-- Template: data-data-table-light -->
<!-- Slots: title, table_content -->
<!-- Composition: Magazine Flow | Intensity: workhorse -->
<div class="slide" style="position: relative; overflow: hidden;">
  <!-- Motif: dot at bottom-right -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <h2 style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: flex-start;">
    <table style="width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--font-body); font-size: var(--size-caption);">

      <!-- Header row: accent background -->
      <thead>
        <tr style="background: var(--color-accent);">
          <th style="padding: 16px 24px; text-align: left; font-family: var(--font-header); font-weight: 700; font-size: var(--size-caption); text-transform: uppercase; letter-spacing: 0.08em; color: #fff; border-radius: 12px 0 0 0;">
            Column A
          </th>
          <th style="padding: 16px 24px; text-align: left; font-family: var(--font-header); font-weight: 700; font-size: var(--size-caption); text-transform: uppercase; letter-spacing: 0.08em; color: #fff;">
            Column B
          </th>
          <th style="padding: 16px 24px; text-align: left; font-family: var(--font-header); font-weight: 700; font-size: var(--size-caption); text-transform: uppercase; letter-spacing: 0.08em; color: #fff;">
            Column C
          </th>
          <th style="padding: 16px 24px; text-align: left; font-family: var(--font-header); font-weight: 700; font-size: var(--size-caption); text-transform: uppercase; letter-spacing: 0.08em; color: #fff; border-radius: 0 12px 0 0;">
            Column D
          </th>
        </tr>
      </thead>

      <tbody>
        <!-- Odd rows: transparent; even rows: var(--color-secondary) for zebra striping -->
        <tr style="background: transparent;">
          <td style="padding: 16px 24px; color: var(--color-text); border-bottom: 1px solid var(--color-border); font-weight: 600;" colspan="4">
            {{table_content}}
          </td>
        </tr>
        <tr style="background: var(--color-secondary);">
          <td style="padding: 16px 24px; color: var(--color-muted); border-bottom: 1px solid var(--color-border);">Row 2, A</td>
          <td style="padding: 16px 24px; color: var(--color-muted); border-bottom: 1px solid var(--color-border);">Row 2, B</td>
          <td style="padding: 16px 24px; color: var(--color-muted); border-bottom: 1px solid var(--color-border);">Row 2, C</td>
          <td style="padding: 16px 24px; color: var(--color-muted); border-bottom: 1px solid var(--color-border);">Row 2, D</td>
        </tr>
        <tr style="background: transparent;">
          <td style="padding: 16px 24px; color: var(--color-text); border-bottom: 1px solid var(--color-border);">Row 3, A</td>
          <td style="padding: 16px 24px; color: var(--color-text); border-bottom: 1px solid var(--color-border);">Row 3, B</td>
          <td style="padding: 16px 24px; color: var(--color-text); border-bottom: 1px solid var(--color-border);">Row 3, C</td>
          <td style="padding: 16px 24px; color: var(--color-text); border-bottom: 1px solid var(--color-border);">Row 3, D</td>
        </tr>
        <tr style="background: var(--color-secondary);">
          <td style="padding: 16px 24px; color: var(--color-muted);">Row 4, A</td>
          <td style="padding: 16px 24px; color: var(--color-muted);">Row 4, B</td>
          <td style="padding: 16px 24px; color: var(--color-muted);">Row 4, C</td>
          <td style="padding: 16px 24px; color: var(--color-muted);">Row 4, D</td>
        </tr>
      </tbody>

    </table>
  </div>
</div>

<!-- Template: data-chart-placeholder-light -->
<!-- Slots: title, subtitle, chart_label, chart_note, x_axis_label, y_axis_label -->
<div class="slide">
  <div style="margin-bottom: var(--gap);">
    <h2 style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 600;">{{title}}</h2>
    <p style="font-size: var(--size-body); color: var(--color-muted); margin-top: 8px; line-height: var(--line-height);">{{subtitle}}</p>
  </div>

  <div style="flex: 1; display: flex; gap: var(--gap); align-items: stretch;">

    <!-- Y-axis label -->
    <div style="display: flex; align-items: center; justify-content: center; width: 32px; flex-shrink: 0;">
      <span style="font-size: var(--size-caption); color: var(--color-muted); white-space: nowrap; transform: rotate(-90deg); display: block; letter-spacing: 0.05em;">
        {{y_axis_label}}
      </span>
    </div>

    <!-- Chart area + x-axis -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 12px;">

      <!-- Main chart placeholder rectangle -->
      <div style="flex: 1; border: 2px dashed var(--color-border); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: transparent; position: relative;">

        <!-- Corner ticks for chart axes feel -->
        <div style="position: absolute; top: 20px; left: 20px; width: 24px; height: 24px; border-top: 2px solid var(--color-border); border-left: 2px solid var(--color-border); border-radius: 2px;"></div>
        <div style="position: absolute; top: 20px; right: 20px; width: 24px; height: 24px; border-top: 2px solid var(--color-border); border-right: 2px solid var(--color-border); border-radius: 2px;"></div>
        <div style="position: absolute; bottom: 20px; left: 20px; width: 24px; height: 24px; border-bottom: 2px solid var(--color-border); border-left: 2px solid var(--color-border); border-radius: 2px;"></div>
        <div style="position: absolute; bottom: 20px; right: 20px; width: 24px; height: 24px; border-bottom: 2px solid var(--color-border); border-right: 2px solid var(--color-border); border-radius: 2px;"></div>

        <!-- Chart icon -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" style="opacity: 0.25;">
          <rect x="4" y="36" width="12" height="24" rx="3" fill="var(--color-accent)"/>
          <rect x="22" y="20" width="12" height="40" rx="3" fill="var(--color-accent)"/>
          <rect x="40" y="10" width="12" height="50" rx="3" fill="var(--color-accent)"/>
          <line x1="2" y1="61" x2="62" y2="61" stroke="var(--color-muted)" stroke-width="2"/>
        </svg>

        <div style="font-family: var(--font-header); font-size: var(--size-body); font-weight: 600; color: var(--color-muted); letter-spacing: 0.05em; text-transform: uppercase;">
          {{chart_label}}
        </div>

        <div style="font-size: var(--size-caption); color: var(--color-muted); opacity: 0.7; max-width: 600px; text-align: center; line-height: var(--line-height);">
          {{chart_note}}
        </div>
      </div>

      <!-- X-axis label -->
      <div style="text-align: center;">
        <span style="font-size: var(--size-caption); color: var(--color-muted); letter-spacing: 0.05em;">{{x_axis_label}}</span>
      </div>

    </div>
  </div>
</div>

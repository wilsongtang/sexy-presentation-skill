<!-- Template: title-gradient-overlay-light -->
<!-- Slots: title, subtitle, image -->
<!-- Composition: Full Bleed | Intensity: hero -->
<div class="slide !p-0" style="position: relative; overflow: hidden;">
  <!-- Full-bleed image with gradient-fade treatment -->
  <div class="img-treatment img-gradient-fade" style="position: absolute; inset: 0;">
    <img src="{{image}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    <div class="img-treatment-overlay"></div>
  </div>

  <!-- Motif: rule at bottom-left for grounding -->
  <div class="motif-element motif-rule" style="position: absolute; bottom: calc(var(--margin) * 2); left: var(--margin); z-index: 2;"></div>
  <!-- Motif: dot at top-right for balance -->
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: calc(var(--margin) + 40px); z-index: 2;"></div>

  <!-- Text anchored to bottom-left, gradient ensures legibility -->
  <div style="position: absolute; bottom: calc(var(--margin) * 3); left: calc(var(--margin) * 1.5); z-index: 2; max-width: 900px;">
    <h1 style="font-size: var(--size-display); font-family: var(--font-header); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: var(--color-text); margin-bottom: var(--gap);">
      {{title}}
    </h1>
    <p style="font-size: var(--size-header); color: var(--color-muted); line-height: 1.4; max-width: 700px;">
      {{subtitle}}
    </p>
  </div>
</div>

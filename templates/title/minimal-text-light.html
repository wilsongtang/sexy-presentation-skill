<!-- Template: title-minimal-text-light -->
<!-- Slots: title -->
<!-- Composition: Minimal Statement | Intensity: hero -->
<div class="slide" style="position: relative; overflow: hidden; display: flex; align-items: center; justify-content: flex-start; padding-left: calc(var(--margin) * 3);">
  <!-- Motif: rule at bottom-left for grounding -->
  <div class="motif-element motif-rule" style="position: absolute; bottom: calc(var(--margin) * 2); left: var(--margin);"></div>
  <!-- Motif: dot at top-right for negative-space balance -->
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: calc(var(--margin) + 40px);"></div>

  <!-- Single title, offset from center for editorial feel, content <30% slide area -->
  <div style="position: relative; z-index: 1; max-width: 900px; padding-bottom: calc(var(--margin) * 1);">
    <h1 style="font-size: var(--size-display); font-family: var(--font-header); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: var(--color-text);">
      {{title}}
    </h1>
  </div>
</div>

<!-- PATTERN: Centered Hero
     PURPOSE: Title slides, hero moments, single powerful statements
     COMPOSITION RULES: Scale contrast (display vs header), one dominant element (the text)
     TYPICAL CATEGORIES: title, closing, structural

     KEY FEATURES:
     - Uses --size-display for maximum text impact
     - Content vertically centered but with slight upward bias (padding-bottom > padding-top)
     - Motifs at corners/edges frame the empty space
     - Overline text above title for category/section context
     - Subtitle at --size-header for dramatic scale contrast (4:1+)
-->
<div class="slide items-center justify-center text-center" style="position: relative; overflow: hidden;">
  <!-- Motif: bottom-left rule for grounding -->
  <div class="motif-element motif-rule" style="position: absolute; bottom: calc(var(--margin) * 2); left: var(--margin);"></div>
  <!-- Motif: top-right dot for balance -->
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: calc(var(--margin) + 40px);"></div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) * 1.5); max-width: 1400px; padding-bottom: calc(var(--margin) * 0.5);">
    <!-- Overline: category/context label -->
    <span class="overline" style="color: var(--color-accent);">{{overline}}</span>
    <!-- Dominant element: display-size title -->
    <h1 style="font-size: var(--size-display); font-family: var(--font-header); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: var(--color-text);">
      {{title}}
    </h1>
    <!-- Supporting: header-size subtitle -->
    <p style="font-size: var(--size-header); color: var(--color-muted); line-height: 1.4; max-width: 900px;">
      {{subtitle}}
    </p>
  </div>
</div>

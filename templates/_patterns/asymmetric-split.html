<!-- PATTERN: Asymmetric Split
     PURPOSE: Text + image, text + supporting content, two-panel layouts
     COMPOSITION RULES: Rule of thirds (60/40 or 55/45 split), edge tension (image bleeds to edge)
     TYPICAL CATEGORIES: title, content, image

     KEY FEATURES:
     - Unequal panel widths (never 50/50) — dominant side gets 55-65%
     - Image panel has zero padding (bleeds to edge)
     - Text panel has generous padding with content anchored to vertical third
     - Motif elements bridge the split or accent the text panel
     - Vertical divider accent line between panels
-->
<div class="slide !p-0" style="display: flex; flex-direction: row; position: relative; overflow: hidden;">
  <!-- Image panel: bleeds to left edge (edge tension) -->
  <div style="width: 45%; height: 100%; flex-shrink: 0;">
    <div class="img-treatment img-desaturate" style="width: 100%; height: 100%;">
      <img src="{{image}}" alt="{{image_alt}}" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>
  </div>

  <!-- Accent divider line -->
  <div style="width: 3px; background: var(--color-accent); opacity: 0.3; flex-shrink: 0;"></div>

  <!-- Text panel: content at vertical third -->
  <div style="flex: 1; padding: calc(var(--margin) * 1.5); display: flex; flex-direction: column; justify-content: center; position: relative;">
    <!-- Motif: subtle dot at top-right of text panel -->
    <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: var(--margin);"></div>

    <span class="overline" style="color: var(--color-accent); margin-bottom: 16px;">{{overline}}</span>
    <h1 style="font-size: var(--size-title); font-family: var(--font-header); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: var(--color-text); margin-bottom: var(--gap);">
      {{title}}
    </h1>
    <p style="font-size: var(--size-body); color: var(--color-muted); line-height: var(--line-height); max-width: 700px;">
      {{subtitle}}
    </p>
  </div>
</div>

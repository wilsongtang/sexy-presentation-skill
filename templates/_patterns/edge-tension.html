<!-- PATTERN: Edge Tension
     PURPOSE: Any layout that needs dynamic energy — content that fights the boundary
     COMPOSITION RULES: Edge tension (primary), layered depth (motif behind content)
     TYPICAL CATEGORIES: ALL — this is a modifier pattern applied to other patterns

     KEY FEATURES:
     - At least ONE element extends to or past slide edge (clip with overflow:hidden)
     - Motif elements deliberately overlap slide boundary
     - Content padding is asymmetric (less padding on tension side)
     - Creates energy by fighting the rectangular constraint

     APPLICATION: Add to any layout by:
     1. Setting overflow:hidden on .slide
     2. Positioning a motif-element at negative offset (e.g., right: -40px)
     3. Reducing padding on one side of main content
-->

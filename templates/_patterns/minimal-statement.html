<!-- PATTERN: Minimal Statement
     PURPOSE: Quote slides, single-sentence impact, dramatic pauses in the deck
     COMPOSITION RULES: Scale contrast (one big element), one dominant element (the text)
     TYPICAL CATEGORIES: quote, structural, closing

     KEY FEATURES:
     - Maximum whitespace — content occupies <30% of slide area
     - Single text element at title or display size
     - Decorative elements are very subtle (motif-subtle intensity)
     - Thin accent line or dot as the only structural element
     - Text offset from center (rule of thirds) for editorial feel
-->
<div class="slide items-center justify-center" style="position: relative; overflow: hidden;">
  <!-- Motif: minimal accent line -->
  <div class="motif-element motif-rule" style="position: absolute; top: 50%; left: var(--margin); transform: translateY(-50%);"></div>

  <div style="position: relative; z-index: 1; max-width: 1200px; text-align: center; padding-bottom: calc(var(--margin) * 0.5);">
    <blockquote style="font-family: var(--font-header); font-size: var(--size-title); font-weight: 400; font-style: italic; line-height: 1.25; color: var(--color-text); letter-spacing: -0.02em;">
      {{quote_text}}
    </blockquote>
    <div style="width: 40px; height: 2px; background: var(--color-accent); margin: calc(var(--gap) * 1.5) auto 0;"></div>
    <p style="font-size: var(--size-caption); color: var(--color-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 16px;">
      {{attribution}}
    </p>
  </div>
</div>

<!-- PATTERN: Comparison Matrix
     PURPOSE: Side-by-side comparisons, pros/cons, before/after, feature matrices
     COMPOSITION RULES: One dominant element (winning side has accent treatment), scale contrast
     TYPICAL CATEGORIES: comparison

     KEY FEATURES:
     - Panels are NOT equal weight — one side has accent border/color treatment
     - Vertical divider between panels is a real DOM element
     - Each panel header uses different visual weight
     - Accent side gets 2px border, non-accent side gets 1px
     - For before/after: "after" side is dominant (accent treatment)
-->
<div class="slide" style="position: relative; overflow: hidden;">
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: var(--margin);"></div>

  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div style="display: flex; flex-direction: row; gap: var(--gap); flex: 1; align-items: stretch;">
    <!-- Left panel (supporting) -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 48px; display: flex; flex-direction: column; gap: 24px;">
      <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text);">{{left_heading}}</h3>
      <div style="width: 40px; height: 2px; background: var(--color-border); border-radius: 2px;"></div>
      <div style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.7;">{{left_content}}</div>
    </div>

    <!-- Vertical divider -->
    <div style="width: 1px; background: var(--color-border); flex-shrink: 0;"></div>

    <!-- Right panel (dominant: accent treatment) -->
    <div style="flex: 1; border: 2px solid var(--color-accent); border-radius: 16px; padding: 48px; display: flex; flex-direction: column; gap: 24px;">
      <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-accent);">{{right_heading}}</h3>
      <div style="width: 40px; height: 3px; background: var(--color-accent); border-radius: 2px;"></div>
      <div style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.7;">{{right_content}}</div>
    </div>
  </div>
</div>

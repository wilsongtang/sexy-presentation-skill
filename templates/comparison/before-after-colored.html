<!-- Template: comparison-before-after-colored -->
<!-- Slots: title, before_label, before_body, before_caption, after_label, after_body, after_caption -->
<div class="slide" style="background-color: var(--color-secondary);">
  <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap); font-family: var(--font-header);">{{title}}</h2>
  <div class="flex flex-row" style="gap: var(--gap); flex: 1; align-items: stretch;">

    <!-- Before Panel -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--color-border);">
      <!-- Label bar -->
      <div style="background: var(--color-muted); padding: 16px 40px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #ffffff; opacity: 0.7; flex-shrink: 0;"></div>
        <span style="font-size: var(--size-caption); font-weight: 700; color: #ffffff; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-header);">{{before_label}}</span>
      </div>
      <!-- Content area -->
      <div style="flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 16px; background: #f9fafb;">
        <div style="font-size: var(--size-body); color: var(--color-text); line-height: 1.6;">{{before_body}}</div>
        <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--color-border);">
          <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5;">{{before_caption}}</p>
        </div>
      </div>
    </div>

    <!-- Arrow connector -->
    <div style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="width: 2px; flex: 1; background: var(--color-border);"></div>
        <span style="font-size: 28px; color: var(--color-accent); line-height: 1;">&#8594;</span>
        <div style="width: 2px; flex: 1; background: var(--color-border);"></div>
      </div>
    </div>

    <!-- After Panel -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 0; border-radius: 16px; overflow: hidden; border: 2px solid var(--color-accent);">
      <!-- Label bar -->
      <div style="background: var(--color-accent); padding: 16px 40px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #ffffff; opacity: 0.9; flex-shrink: 0;"></div>
        <span style="font-size: var(--size-caption); font-weight: 700; color: #ffffff; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-header);">{{after_label}}</span>
      </div>
      <!-- Content area -->
      <div style="flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 16px; background: #ffffff;">
        <div style="font-size: var(--size-body); color: var(--color-text); line-height: 1.6;">{{after_body}}</div>
        <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--color-border);">
          <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5;">{{after_caption}}</p>
        </div>
      </div>
    </div>

  </div>
</div>

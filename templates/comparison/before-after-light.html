<!-- Template: comparison-before-after-light -->
<!-- Slots: title, before_heading, before_body, after_heading, after_body -->
<!-- Composition: Comparison Matrix | Intensity: impact -->
<div class="slide light" style="position: relative; overflow: hidden;">
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: var(--margin);"></div>

  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div style="display: flex; flex-direction: row; gap: 0; flex: 1; align-items: stretch;">

    <!-- Before panel (left, standard) -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 48px; display: flex; flex-direction: column; gap: 24px; margin-right: 24px;">
      <div style="display: flex; flex-direction: row; align-items: center; gap: 12px;">
        <div style="width: 10px; height: 10px; border-radius: 50%; background: var(--color-muted); flex-shrink: 0;"></div>
        <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text); font-family: var(--font-header); text-transform: uppercase; letter-spacing: 0.06em;">{{before_heading}}</h3>
      </div>
      <div style="width: 40px; height: 2px; background: var(--color-border); border-radius: 2px;"></div>
      <div style="font-size: var(--size-body); color: var(--color-muted); line-height: 1.7;">{{before_body}}</div>
    </div>

    <!-- Arrow indicator between panels -->
    <div style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%;">
        <div style="width: 1px; flex: 1; background: var(--color-border);"></div>
        <span style="font-size: 28px; color: var(--color-accent); line-height: 1; flex-shrink: 0;">→</span>
        <div style="width: 1px; flex: 1; background: var(--color-border);"></div>
      </div>
    </div>

    <!-- After panel (right, dominant accent) -->
    <div style="flex: 1; border: 2px solid var(--color-accent); border-radius: 16px; padding: 48px; display: flex; flex-direction: column; gap: 24px; margin-left: 24px;">
      <div style="display: flex; flex-direction: row; align-items: center; gap: 12px;">
        <div style="width: 10px; height: 10px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0;"></div>
        <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-accent); font-family: var(--font-header); text-transform: uppercase; letter-spacing: 0.06em;">{{after_heading}}</h3>
      </div>
      <div style="width: 40px; height: 3px; background: var(--color-accent); border-radius: 2px;"></div>
      <div style="font-size: var(--size-body); color: var(--color-muted); line-height: 1.7;">{{after_body}}</div>
    </div>

  </div>
</div>

<!-- Template: comparison-pros-cons-reversed -->
<!-- Slots: title, pros_heading, pros_items, cons_heading, cons_items -->
<!-- Composition: Comparison Matrix | Intensity: impact -->
<div class="slide light" style="background-color: var(--color-primary); position: relative; overflow: hidden;">
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: var(--margin);"></div>

  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text-reversed); margin-bottom: var(--gap);">{{title}}</h2>

  <div style="display: flex; flex-direction: row; gap: var(--gap); flex: 1; align-items: stretch;">

    <!-- Cons panel (left, subdued) -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 48px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-direction: row; align-items: center; gap: 14px;">
        <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--color-border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <span style="font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.6); line-height: 1;">−</span>
        </div>
        <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); font-family: var(--font-header);">{{cons_heading}}</h3>
      </div>
      <div style="width: 40px; height: 2px; background: var(--color-border); border-radius: 2px;"></div>
      <div style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.7;">{{cons_items}}</div>
    </div>

    <!-- Vertical divider -->
    <div style="width: 1px; background: var(--color-border); flex-shrink: 0; align-self: stretch;"></div>

    <!-- Pros panel (right, dominant accent) -->
    <div style="flex: 1; border: 2px solid var(--color-accent); border-radius: 16px; padding: 48px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-direction: row; align-items: center; gap: 14px;">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--color-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <span style="font-size: 18px; font-weight: 700; color: #fff; line-height: 1;">+</span>
        </div>
        <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-accent); font-family: var(--font-header);">{{pros_heading}}</h3>
      </div>
      <div style="width: 40px; height: 3px; background: var(--color-accent); border-radius: 2px;"></div>
      <div style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.7;">{{pros_items}}</div>
    </div>

  </div>
</div>

<div class="slide" style="background-color: var(--color-secondary);">

      </div>
      <div>
        <p style="font-size: var(--size-body); font-weight: 600; font-family: var(--font-header); color: var(--color-text);">{{member_1_name}}</p>
        <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body); margin-top: 4px;">{{member_1_role}}</p>

<!-- Template: structural-agenda-light -->
<!-- Slots: title, agenda_1, agenda_2, agenda_3, agenda_4 -->
<!-- Composition: Magazine Flow | Intensity: workhorse -->
<div class="slide" style="position: relative; overflow: hidden;">

  <!-- Motif: bottom-right dot -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <!-- Slide title -->
  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 700; letter-spacing: -0.02em; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <!-- Agenda items listed vertically with 24px gap -->
  <div style="display: flex; flex-direction: column; gap: 24px; flex: 1; justify-content: center; max-width: 1200px;">

    <!-- Agenda item 1 -->
    <div style="display: flex; align-items: center; gap: 24px;">
      <!-- Numbered circle: 40px accent bg, white number text -->
      <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: var(--font-header); font-size: var(--size-caption); font-weight: 700; color: #fff; line-height: 1;">1</span>
      </div>
      <p style="font-size: var(--size-body); font-family: var(--font-body); color: var(--color-text); line-height: 1.5;">{{agenda_1}}</p>
    </div>

    <!-- Agenda item 2 -->
    <div style="display: flex; align-items: center; gap: 24px;">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: var(--font-header); font-size: var(--size-caption); font-weight: 700; color: #fff; line-height: 1;">2</span>
      </div>
      <p style="font-size: var(--size-body); font-family: var(--font-body); color: var(--color-text); line-height: 1.5;">{{agenda_2}}</p>
    </div>

    <!-- Agenda item 3 -->
    <div style="display: flex; align-items: center; gap: 24px;">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: var(--font-header); font-size: var(--size-caption); font-weight: 700; color: #fff; line-height: 1;">3</span>
      </div>
      <p style="font-size: var(--size-body); font-family: var(--font-body); color: var(--color-text); line-height: 1.5;">{{agenda_3}}</p>
    </div>

    <!-- Agenda item 4 -->
    <div style="display: flex; align-items: center; gap: 24px;">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: var(--font-header); font-size: var(--size-caption); font-weight: 700; color: #fff; line-height: 1;">4</span>
      </div>
      <p style="font-size: var(--size-body); font-family: var(--font-body); color: var(--color-text); line-height: 1.5;">{{agenda_4}}</p>
    </div>

  </div>

</div>

<!-- Template: structural-recap-colored -->
<!-- Slots: title, recap_1, recap_2, recap_3 -->
<!-- Composition: Card Grid | Intensity: workhorse -->
<div class="slide" style="background-color: var(--color-secondary); position: relative; overflow: hidden;">

  <!-- Motif: bottom-right dot -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <!-- Slide title -->
  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <!-- 3-column card grid -->
  <div style="display: flex; flex-direction: row; gap: var(--gap); flex: 1; align-items: stretch;">

    <!-- Card 1: dominant — accent border -->
    <div style="flex: 1.15; border: 2px solid var(--color-accent); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <!-- Numbered circle: 40px accent bg, white number -->
      <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: var(--font-header); font-size: var(--size-caption); font-weight: 700; color: #fff; line-height: 1;">1</span>
      </div>
      <p style="font-size: var(--size-body); font-family: var(--font-body); color: var(--color-text); line-height: 1.6;">{{recap_1}}</p>
    </div>

    <!-- Card 2: supporting -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.7;">
        <span style="font-family: var(--font-header); font-size: var(--size-caption); font-weight: 700; color: #fff; line-height: 1;">2</span>
      </div>
      <p style="font-size: var(--size-body); font-family: var(--font-body); color: var(--color-text); line-height: 1.6;">{{recap_2}}</p>
    </div>

    <!-- Card 3: supporting -->
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.7;">
        <span style="font-family: var(--font-header); font-size: var(--size-caption); font-weight: 700; color: #fff; line-height: 1;">3</span>
      </div>
      <p style="font-size: var(--size-body); font-family: var(--font-body); color: var(--color-text); line-height: 1.6;">{{recap_3}}</p>
    </div>

  </div>

</div>

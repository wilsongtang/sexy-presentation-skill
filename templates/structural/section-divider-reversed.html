<!-- Template: structural-section-divider-reversed -->
<!-- Slots: section_number, section_title -->
<div class="slide items-center justify-center text-center" style="background-color: var(--color-primary); position: relative; overflow: hidden;">
  <!-- Subtle large background number -->
  <div style="position: absolute; font-family: var(--font-header); font-size: 600px; font-weight: 800; color: var(--color-secondary); opacity: 0.06; line-height: 1; user-select: none; pointer-events: none; letter-spacing: -0.05em; top: 50%; left: 50%; transform: translate(-50%, -50%);">{{section_number}}</div>

  <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) * 0.8);">
    <!-- Section number -->
    <p style="font-family: var(--font-body); font-size: var(--size-body); color: var(--color-accent); letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500;">Section {{section_number}}</p>
    <!-- Thin divider line -->
    <div style="width: 80px; height: 2px; background: var(--color-accent);"></div>
    <!-- Section title -->
    <h1 style="font-family: var(--font-header); font-size: var(--size-title); font-weight: 700; color: var(--color-text-reversed); letter-spacing: -0.02em; max-width: 1200px; line-height: 1.15;">{{section_title}}</h1>
  </div>
</div>

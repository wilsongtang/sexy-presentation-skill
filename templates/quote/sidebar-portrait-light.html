<!-- Template: quote-sidebar-portrait-light -->
<!-- Slots: quote_text, attribution, image -->
<!-- Composition: Asymmetric Split | Intensity: impact -->
<div class="slide !p-0" style="display: flex; flex-direction: row; position: relative; overflow: hidden;">
  <!-- Image panel: 40%, bleeds to left edge (edge tension) -->
  <div style="width: 40%; height: 100%; flex-shrink: 0;">
    <div class="img-treatment img-desaturate" style="width: 100%; height: 100%;">
      <img src="{{image}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>
  </div>

  <!-- 3px accent divider between panels -->
  <div style="width: 3px; background: var(--color-accent); opacity: 0.4; flex-shrink: 0;"></div>

  <!-- Text panel: 60%, quote content -->
  <div style="flex: 1; padding: calc(var(--margin) * 1.5); display: flex; flex-direction: column; justify-content: center; position: relative; gap: calc(var(--gap) * 1.5);">
    <!-- Motif: dot in text panel -->
    <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: var(--margin);"></div>

    <!-- Decorative opening quotation mark in text panel (real div, 320px, accent, 12% opacity) -->
    <div aria-hidden="true" style="position: absolute; top: calc(var(--margin) * -0.5); left: calc(var(--margin) * 1.5); font-family: var(--font-header); font-size: 320px; line-height: 1; color: var(--color-accent); opacity: 0.12; user-select: none; pointer-events: none; letter-spacing: -0.05em;">&ldquo;</div>

    <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: calc(var(--gap) * 1.2);">
      <blockquote style="font-family: var(--font-header); font-size: var(--size-title); font-weight: 400; font-style: italic; line-height: 1.25; color: var(--color-text); letter-spacing: -0.02em; margin: 0;">
        {{quote_text}}
      </blockquote>
      <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body); font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; margin: 0;">
        &mdash; {{attribution}}
      </p>
    </div>
  </div>
</div>

<!-- Template: quote-sidebar-portrait-reversed -->
<!-- Slots: quote_text, attribution, speaker_name, speaker_title -->
<div class="slide !p-0 flex-row" style="background-color: var(--color-primary); overflow: hidden;">
  <!-- Left: Speaker photo placeholder (40%) -->
  <div style="width: 40%; height: 100%; flex-shrink: 0; background: var(--color-secondary); opacity: 0.18; position: relative; display: flex; align-items: flex-end; justify-content: flex-start; padding: var(--margin);">
    <div style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center;">
      <div style="width: 280px; height: 280px; border-radius: 50%; background: var(--color-border); display: flex; align-items: center; justify-content: center;">
        <svg width="100" height="100" viewBox="0 0 24 24" fill="none" style="opacity: 0.4;">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="rgba(255,255,255,0.6)"/>
        </svg>
      </div>
    </div>
    <!-- Speaker name overlay at bottom -->
    <div style="position: relative; z-index: 10;">
      <p style="font-size: var(--size-caption); font-weight: 600; color: var(--color-text-reversed); font-family: var(--font-body);">{{speaker_name}}</p>
      <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-family: var(--font-body);">{{speaker_title}}</p>
    </div>
  </div>

  <!-- Right: Quote content (60%) -->
  <div style="width: 60%; padding: var(--margin); display: flex; flex-direction: column; justify-content: center; gap: var(--gap);">
    <!-- Quotation mark accent -->
    <div style="font-family: var(--font-header); font-size: 120px; line-height: 0.8; color: var(--color-accent); font-style: italic; user-select: none;">&ldquo;</div>
    <blockquote style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 400; font-style: italic; line-height: var(--line-height); color: var(--color-text-reversed); margin-top: calc(var(--gap) * 0.5);">
      {{quote_text}}
    </blockquote>
    <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-family: var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; margin-top: calc(var(--gap) * 0.5);">
      &mdash; {{attribution}}
    </p>
  </div>
</div>

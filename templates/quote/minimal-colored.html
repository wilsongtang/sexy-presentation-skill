<!-- Template: quote-minimal-colored -->
<!-- Slots: quote_text, attribution -->
<!-- Composition: Minimal Statement | Intensity: impact -->
<div class="slide" style="background-color: var(--color-secondary); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: flex-start;">
  <!-- Motif: vertical rule at left edge -->
  <div class="motif-element motif-rule" style="position: absolute; top: 50%; left: var(--margin); transform: translateY(-50%);"></div>

  <!-- Content: offset from center (rule of thirds), maximum whitespace -->
  <div style="position: relative; z-index: 1; max-width: 800px; margin-left: calc(var(--margin) * 4); display: flex; flex-direction: column; gap: calc(var(--gap) * 1.5);">
    <blockquote style="font-family: var(--font-header); font-size: var(--size-title); font-weight: 400; font-style: italic; line-height: 1.25; color: var(--color-text); letter-spacing: -0.02em; margin: 0;">
      {{quote_text}}
    </blockquote>

    <!-- Thin 40px accent line below quote (NO decorative quotation marks) -->
    <div style="width: 40px; height: 2px; background: var(--color-accent);"></div>

    <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body); font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; margin: 0;">
      &mdash; {{attribution}}
    </p>
  </div>
</div>

<!-- Template: quote-minimal-reversed -->
<!-- Slots: quote_text, attribution -->
<div class="slide justify-center" style="background-color: var(--color-primary); position: relative;">
  <div style="max-width: 1100px; display: flex; flex-direction: row; gap: 56px; align-items: flex-start;">
    <!-- Thin left accent border -->
    <div style="width: 4px; height: 100%; min-height: 120px; background: var(--color-accent); flex-shrink: 0; border-radius: 2px;"></div>

    <div style="display: flex; flex-direction: column; gap: calc(var(--gap) * 1.2);">
      <blockquote style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 400; font-style: italic; line-height: var(--line-height); color: var(--color-text-reversed);">
        {{quote_text}}
      </blockquote>
      <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-family: var(--font-body); font-style: normal; font-variant: small-caps; letter-spacing: 0.12em;">
        &mdash; {{attribution}}
      </p>
    </div>
  </div>
</div>

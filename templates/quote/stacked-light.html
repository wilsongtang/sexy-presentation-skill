<!-- Template: quote-stacked-light -->
<!-- Slots: quote_1_text, quote_1_attribution, quote_2_text, quote_2_attribution -->
<!-- Composition: Magazine Flow | Intensity: workhorse -->
<div class="slide" style="position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 0;">
  <!-- Motif: dot at bottom-right -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: var(--margin); right: var(--margin);"></div>

  <!-- Quote 1: dominant (--size-title), with decorative quotation mark -->
  <div style="position: relative; padding-bottom: calc(var(--gap) * 2);">
    <!-- Decorative opening quotation mark for first quote (real div, 320px, accent, 12% opacity) -->
    <div aria-hidden="true" style="position: absolute; top: calc(var(--margin) * -1); left: calc(var(--margin) * -0.5); font-family: var(--font-header); font-size: 320px; line-height: 1; color: var(--color-accent); opacity: 0.12; user-select: none; pointer-events: none; letter-spacing: -0.05em;">&ldquo;</div>

    <div style="position: relative; z-index: 1; max-width: 1400px; display: flex; flex-direction: column; gap: var(--gap);">
      <blockquote style="font-family: var(--font-header); font-size: var(--size-title); font-weight: 400; font-style: italic; line-height: 1.25; color: var(--color-text); letter-spacing: -0.02em; margin: 0;">
        {{quote_1_text}}
      </blockquote>
      <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body); font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; margin: 0;">
        &mdash; {{quote_1_attribution}}
      </p>
    </div>
  </div>

  <!-- Divider between quotes -->
  <div style="width: 100%; height: 1px; background: var(--color-border); margin-bottom: calc(var(--gap) * 2);"></div>

  <!-- Quote 2: smaller (--size-body), no decorative mark -->
  <div style="max-width: 1200px; display: flex; flex-direction: column; gap: var(--gap);">
    <blockquote style="font-family: var(--font-header); font-size: var(--size-body); font-weight: 400; font-style: italic; line-height: 1.5; color: var(--color-text); letter-spacing: -0.01em; margin: 0;">
      {{quote_2_text}}
    </blockquote>
    <p style="font-size: var(--size-caption); color: var(--color-muted); font-family: var(--font-body); font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; margin: 0;">
      &mdash; {{quote_2_attribution}}
    </p>
  </div>
</div>

<!-- Template: quote-stacked-reversed -->
<!-- Slots: quote_1_text, quote_1_attribution, quote_2_text, quote_2_attribution -->
<div class="slide justify-center" style="background-color: var(--color-primary); gap: calc(var(--gap) * 1.5);">
  <!-- Quote 1 -->
  <div style="display: flex; flex-direction: row; gap: 48px; align-items: flex-start; max-width: 1400px; padding-bottom: calc(var(--gap) * 1.5); border-bottom: 1px solid var(--color-border);">
    <div style="font-family: var(--font-header); font-size: 96px; line-height: 0.8; color: var(--color-accent); font-style: italic; flex-shrink: 0; opacity: 0.5; user-select: none;">&ldquo;</div>
    <div style="display: flex; flex-direction: column; gap: calc(var(--gap) * 0.6);">
      <blockquote style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 400; font-style: italic; line-height: var(--line-height); color: var(--color-text-reversed);">
        {{quote_1_text}}
      </blockquote>
      <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-family: var(--font-body); letter-spacing: 0.08em; text-transform: uppercase;">
        &mdash; {{quote_1_attribution}}
      </p>
    </div>
  </div>

  <!-- Quote 2 -->
  <div style="display: flex; flex-direction: row; gap: 48px; align-items: flex-start; max-width: 1400px;">
    <div style="font-family: var(--font-header); font-size: 96px; line-height: 0.8; color: var(--color-accent); font-style: italic; flex-shrink: 0; opacity: 0.5; user-select: none;">&ldquo;</div>
    <div style="display: flex; flex-direction: column; gap: calc(var(--gap) * 0.6);">
      <blockquote style="font-family: var(--font-header); font-size: var(--size-header); font-weight: 400; font-style: italic; line-height: var(--line-height); color: var(--color-text-reversed);">
        {{quote_2_text}}
      </blockquote>
      <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-family: var(--font-body); letter-spacing: 0.08em; text-transform: uppercase;">
        &mdash; {{quote_2_attribution}}
      </p>
    </div>
  </div>
</div>

<!-- Template: image-captioned-center-reversed -->
<!-- Slots: title, image, caption -->
<div class="slide items-center justify-center" style="background-color: var(--color-primary); gap: var(--gap);">
  <h2 style="font-size: var(--size-header); font-weight: 600; text-align: center; flex-shrink: 0;">{{title}}</h2>
  <div style="max-width: 70%; flex: 1; overflow: hidden; border-radius: 12px; border: 1px solid var(--color-border);">
    <img src="{{image}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
  </div>
  <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); text-align: center; max-width: 70%; flex-shrink: 0;">{{caption}}</p>
</div>

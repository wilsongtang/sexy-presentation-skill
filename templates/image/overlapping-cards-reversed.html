<!-- Template: image-overlapping-cards-reversed -->
<!-- Slots: title, image_1, image_2, image_3 -->
<!-- Composition: Layered Stack | Intensity: impact -->
<div class="slide" style="background-color: var(--color-primary); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center;">

  <!-- Motif: dot at bottom-right -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px); z-index: 10;"></div>

  <!-- Title -->
  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text-reversed); text-align: center; flex-shrink: 0; margin-bottom: var(--gap);">{{title}}</h2>

  <!-- Layered stack of overlapping cards -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative; width: 100%;">

    <!-- Left card: z-index 1, rotated -6deg, lowest shadow depth -->
    <div style="position: absolute; width: 420px; height: 300px; border-radius: 16px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.10); transform: rotate(-6deg) translateX(-260px); z-index: 1;">
      <div class="img-treatment img-color-wash" style="width: 100%; height: 100%;">
        <img src="{{image_1}}" alt="{{title}} image 1" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="img-treatment-overlay"></div>
      </div>
    </div>

    <!-- Center card: z-index 3, no rotation, deepest shadow -->
    <div style="position: absolute; width: 460px; height: 330px; border-radius: 16px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 16px 48px rgba(0,0,0,0.20); transform: translateY(0); z-index: 3;">
      <div class="img-treatment img-color-wash" style="width: 100%; height: 100%;">
        <img src="{{image_2}}" alt="{{title}} image 2" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="img-treatment-overlay"></div>
      </div>
    </div>

    <!-- Right card: z-index 2, rotated +6deg, medium shadow depth -->
    <div style="position: absolute; width: 420px; height: 300px; border-radius: 16px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 8px 32px rgba(0,0,0,0.14); transform: rotate(6deg) translateX(260px); z-index: 2;">
      <div class="img-treatment img-color-wash" style="width: 100%; height: 100%;">
        <img src="{{image_3}}" alt="{{title}} image 3" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="img-treatment-overlay"></div>
      </div>
    </div>

  </div>

</div>

<!-- Template: image-overlapping-cards-reversed -->
<!-- Slots: title, image_1, image_2, image_3 -->
<div class="slide items-center justify-center" style="background-color: var(--color-primary); gap: var(--gap);">
  <h2 style="font-size: var(--size-header); font-weight: 600; text-align: center; flex-shrink: 0;">{{title}}</h2>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative; width: 100%;">
    <!-- Left card, tilted counter-clockwise -->
    <div style="position: absolute; width: 420px; height: 300px; border-radius: 16px; overflow: hidden; border: 4px solid white; box-shadow: 0 8px 32px rgba(0,0,0,0.12); transform: rotate(-6deg) translateX(-260px); z-index: 1;">
      <img src="{{image_1}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <!-- Center card, flat and on top -->
    <div style="position: absolute; width: 460px; height: 330px; border-radius: 16px; overflow: hidden; border: 4px solid white; box-shadow: 0 16px 48px rgba(0,0,0,0.18); transform: translateY(0px); z-index: 3;">
      <img src="{{image_2}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <!-- Right card, tilted clockwise -->
    <div style="position: absolute; width: 420px; height: 300px; border-radius: 16px; overflow: hidden; border: 4px solid white; box-shadow: 0 8px 32px rgba(0,0,0,0.12); transform: rotate(6deg) translateX(260px); z-index: 2;">
      <img src="{{image_3}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
  </div>
</div>

<!-- Template: image-full-bleed-colored -->
<!-- Slots: image, caption -->
<div class="slide !p-0" style="background-color: var(--color-secondary); position: relative;">
  <img src="{{image}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: var(--margin) calc(var(--margin) * 1.5); background: linear-gradient(to top, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0) 100%);">
    <p style="font-size: var(--size-caption); color: var(--color-text); max-width: 900px;">{{caption}}</p>
  </div>
</div>

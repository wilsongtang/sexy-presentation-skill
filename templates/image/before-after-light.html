<!-- Template: image-before-after-light -->
<!-- Slots: title, before_image, after_image, before_label, after_label -->
<!-- Composition: Comparison Matrix | Intensity: impact -->
<div class="slide" style="position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Motif: dot at top-right -->
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: var(--margin); z-index: 2;"></div>

  <!-- Title -->
  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap); flex-shrink: 0;">{{title}}</h2>

  <!-- Comparison panels -->
  <div style="flex: 1; display: flex; flex-direction: row; gap: 0; overflow: hidden;">

    <!-- Before panel: 1px border (supporting side) -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
      <div class="img-treatment img-desaturate" style="flex: 1; overflow: hidden; border-radius: 12px; border: 1px solid var(--color-border);">
        <img src="{{before_image}}" alt="Before: {{before_label}}" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="img-treatment-overlay"></div>
      </div>
      <p style="font-size: var(--size-caption); font-weight: 600; color: var(--color-muted); text-align: center; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0;">{{before_label}}</p>
    </div>

    <!-- Vertical divider -->
    <div style="width: 1px; background: var(--color-border); flex-shrink: 0; margin: 0 var(--gap);"></div>

    <!-- After panel: 2px accent border (dominant side) -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
      <div class="img-treatment img-desaturate" style="flex: 1; overflow: hidden; border-radius: 12px; border: 2px solid var(--color-accent);">
        <img src="{{after_image}}" alt="After: {{after_label}}" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="img-treatment-overlay"></div>
      </div>
      <p style="font-size: var(--size-caption); font-weight: 600; color: var(--color-accent); text-align: center; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0;">{{after_label}}</p>
    </div>

  </div>

</div>

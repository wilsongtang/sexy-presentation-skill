<!-- Template: image-gallery-strip-light -->
<!-- Slots: title, image_1, image_2, image_3, image_4 -->
<!-- Composition: Edge Tension | Intensity: workhorse -->
<div class="slide !px-0" style="position: relative; overflow: hidden; display: flex; flex-direction: column; padding-top: var(--margin); padding-bottom: var(--margin);">

  <!-- Motif: dot at top-right, slightly outside boundary for edge tension -->
  <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: -8px; z-index: 2;"></div>

  <!-- Title: with horizontal padding so it aligns to margin -->
  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap); flex-shrink: 0; padding-left: var(--margin); padding-right: var(--margin);">{{title}}</h2>

  <!-- Horizontal image strip: zero side padding (bleeds left and right edges) -->
  <div style="flex: 1; display: flex; flex-direction: row; gap: 0; overflow: hidden;">

    <div class="img-treatment img-color-wash" style="flex: 1; height: 100%;">
      <img src="{{image_1}}" alt="{{title}} image 1" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

    <div class="img-treatment img-color-wash" style="flex: 1; height: 100%;">
      <img src="{{image_2}}" alt="{{title}} image 2" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

    <div class="img-treatment img-color-wash" style="flex: 1; height: 100%;">
      <img src="{{image_3}}" alt="{{title}} image 3" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

    <div class="img-treatment img-color-wash" style="flex: 1; height: 100%;">
      <img src="{{image_4}}" alt="{{title}} image 4" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

  </div>

</div>

<!-- Template: image-gallery-2x2-light -->
<!-- Slots: title, image_1, image_2, image_3, image_4, caption -->
<!-- Composition: Card Grid | Intensity: workhorse -->
<div class="slide" style="position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Motif: dot at bottom-right -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px); z-index: 2;"></div>

  <!-- Title -->
  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap); flex-shrink: 0;">{{title}}</h2>

  <!-- 2x2 Image grid -->
  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; overflow: hidden;">

    <div class="img-treatment img-color-wash" style="border-radius: 8px; overflow: hidden;">
      <img src="{{image_1}}" alt="{{title}} image 1" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

    <div class="img-treatment img-color-wash" style="border-radius: 8px; overflow: hidden;">
      <img src="{{image_2}}" alt="{{title}} image 2" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

    <div class="img-treatment img-color-wash" style="border-radius: 8px; overflow: hidden;">
      <img src="{{image_3}}" alt="{{title}} image 3" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

    <div class="img-treatment img-color-wash" style="border-radius: 8px; overflow: hidden;">
      <img src="{{image_4}}" alt="{{title}} image 4" style="width: 100%; height: 100%; object-fit: cover;">
      <div class="img-treatment-overlay"></div>
    </div>

  </div>

  <!-- Caption below grid -->
  <p style="font-size: var(--size-caption); color: var(--color-muted); margin-top: var(--gap); flex-shrink: 0;">{{caption}}</p>

</div>

<!-- Template: image-before-after-colored -->
<!-- Slots: image_before, image_after -->
<div class="slide" style="background-color: var(--color-secondary); !p-0 flex-row">
  <div style="width: 50%; height: 100%; position: relative; overflow: hidden;">
    <img src="{{image_before}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    <div style="position: absolute; top: calc(var(--margin) * 0.75); left: calc(var(--margin) * 0.75); background: white; border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 20px;">
      <span style="font-size: var(--size-caption); font-weight: 600; color: var(--color-text); letter-spacing: 0.05em; text-transform: uppercase;">Before</span>
    </div>
  </div>
  <div style="width: 2px; height: 100%; background: var(--color-border); flex-shrink: 0; position: relative; z-index: 10;"></div>
  <div style="width: 50%; height: 100%; position: relative; overflow: hidden;">
    <img src="{{image_after}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    <div style="position: absolute; top: calc(var(--margin) * 0.75); left: calc(var(--margin) * 0.75); background: var(--color-accent); border-radius: 8px; padding: 8px 20px;">
      <span style="font-size: var(--size-caption); font-weight: 600; color: white; letter-spacing: 0.05em; text-transform: uppercase;">After</span>
    </div>
  </div>
</div>

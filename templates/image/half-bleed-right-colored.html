<!-- Template: image-half-bleed-right-colored -->
<!-- Slots: title, body, image -->
<div class="slide" style="background-color: var(--color-secondary); !p-0 flex-row">
  <div style="width: 50%; padding: var(--margin); display: flex; flex-direction: column; justify-content: center; gap: var(--gap);">
    <h2 style="font-size: var(--size-header); font-weight: 600; line-height: 1.2;">{{title}}</h2>
    <p style="font-size: var(--size-body); color: var(--color-muted); line-height: 1.6;">{{body}}</p>
  </div>
  <div style="width: 50%; height: 100%; overflow: hidden; flex-shrink: 0;">
    <img src="{{image}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
  </div>
</div>

<!-- Template: timeline-milestone-reversed -->
<!-- Slots: title, milestone_1_date, milestone_1_title, milestone_1_body, milestone_2_date, milestone_2_title, milestone_2_body, milestone_3_date, milestone_3_title, milestone_3_body -->
<!-- Composition: Timeline Flow | Intensity: impact -->
<div class="slide" style="background-color: var(--color-primary); position: relative; overflow: hidden;">

  <!-- Motif: rule at bottom -->
  <div class="motif-element" style="position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: var(--color-accent); opacity: 0.25; pointer-events: none;"></div>

  <h2 style="font-size: var(--size-header); font-weight: 600; color: var(--color-text-reversed); margin-bottom: var(--gap);">{{title}}</h2>

  <div class="flex flex-col" style="flex: 1; justify-content: center;">

    <!-- Milestone cards row -->
    <div class="flex flex-row" style="align-items: stretch; gap: 0; position: relative;">

      <!-- Connecting line behind cards -->
      <div style="position: absolute; left: 0; right: 0; height: 3px; background: var(--color-border); top: 48px; z-index: 0;"></div>

      <!-- Milestone 1 — active/dominant -->
      <div style="flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; padding: 32px; background: var(--color-surface, #fff); border: 2px solid var(--color-accent); border-radius: 16px; margin-right: 12px;">
        <!-- Active dot (20px, accent fill) at top-center -->
        <div style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; background: var(--color-accent); z-index: 2;"></div>
        <span style="font-size: var(--size-caption); color: var(--color-accent); font-weight: 600; margin-bottom: 10px; display: block;">{{milestone_1_date}}</span>
        <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-text-reversed); margin-bottom: 10px; line-height: 1.3;">{{milestone_1_title}}</h3>
        <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.5; margin: 0; flex: 1;">{{milestone_1_body}}</p>
      </div>

      <!-- Milestone 2 — future -->
      <div style="flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; padding: 32px; border: 1px solid var(--color-border); border-radius: 16px; margin-right: 12px;">
        <!-- Future dot (16px, border-only) -->
        <div style="position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; z-index: 2;"></div>
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500; margin-bottom: 10px; display: block;">{{milestone_2_date}}</span>
        <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); margin-bottom: 10px; line-height: 1.3;">{{milestone_2_title}}</h3>
        <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.5; margin: 0; flex: 1;">{{milestone_2_body}}</p>
      </div>

      <!-- Milestone 3 — future -->
      <div style="flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; padding: 32px; border: 1px solid var(--color-border); border-radius: 16px;">
        <!-- Future dot (16px, border-only) -->
        <div style="position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; z-index: 2;"></div>
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500; margin-bottom: 10px; display: block;">{{milestone_3_date}}</span>
        <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); margin-bottom: 10px; line-height: 1.3;">{{milestone_3_title}}</h3>
        <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.5; margin: 0; flex: 1;">{{milestone_3_body}}</p>
      </div>

    </div>
  </div>
</div>

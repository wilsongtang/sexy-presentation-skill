<!-- Template: timeline-horizontal-reversed -->
<!-- Slots: title, point_1_date, point_1_label, point_2_date, point_2_label, point_3_date, point_3_label, point_4_date, point_4_label, point_5_date, point_5_label -->
<!-- Composition: Timeline Flow | Intensity: workhorse -->
<div class="slide" style="background-color: var(--color-primary); position: relative; overflow: hidden;">

  <!-- Motif: dot at start of timeline line -->
  <div class="motif-element" style="position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--color-border); opacity: 0.18; pointer-events: none;"></div>

  <h2 style="font-size: var(--size-header); font-weight: 600; color: var(--color-text-reversed); margin-bottom: var(--gap);">{{title}}</h2>

  <div class="flex flex-col" style="flex: 1; justify-content: center;">

    <!-- Labels above the line: points 1, 3, 5 -->
    <div class="flex flex-row" style="align-items: flex-end; padding: 0 64px; margin-bottom: 0;">
      <!-- Point 1 above (active) -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 20px;">
        <span style="font-size: var(--size-caption); color: var(--color-accent); font-weight: 600;">{{point_1_date}}</span>
        <span style="font-size: var(--size-body); font-weight: 700; color: var(--color-text-reversed); text-align: center;">{{point_1_label}}</span>
      </div>
      <!-- Point 2 spacer above -->
      <div style="flex: 1;"></div>
      <!-- Point 3 above -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 20px;">
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_3_date}}</span>
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_3_label}}</span>
      </div>
      <!-- Point 4 spacer above -->
      <div style="flex: 1;"></div>
      <!-- Point 5 above -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 20px;">
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_5_date}}</span>
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_5_label}}</span>
      </div>
    </div>

    <!-- Horizontal connecting line + dot markers -->
    <div class="flex flex-row" style="align-items: center; padding: 0 64px; position: relative;">

      <!-- Background connecting line (full width) -->
      <div style="position: absolute; left: 64px; right: 64px; height: 3px; background: var(--color-border); top: 50%; transform: translateY(-50%); z-index: 0;"></div>

      <!-- Point 1 — active dot (20px, accent fill) -->
      <div style="flex: 1; display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 20px; height: 20px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0;"></div>
      </div>

      <!-- Connector 1→2 (accent, showing progression from active) -->
      <div style="flex: 1; height: 3px; background: var(--color-accent); position: relative; z-index: 0;"></div>

      <!-- Point 2 — future dot (16px, border-only) -->
      <div style="display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; flex-shrink: 0;"></div>
      </div>

      <!-- Connector 2→3 -->
      <div style="flex: 1; height: 3px; background: var(--color-border); position: relative; z-index: 0;"></div>

      <!-- Point 3 — future dot (16px, border-only) -->
      <div style="display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; flex-shrink: 0;"></div>
      </div>

      <!-- Connector 3→4 -->
      <div style="flex: 1; height: 3px; background: var(--color-border); position: relative; z-index: 0;"></div>

      <!-- Point 4 — future dot (16px, border-only) -->
      <div style="display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; flex-shrink: 0;"></div>
      </div>

      <!-- Connector 4→5 -->
      <div style="flex: 1; height: 3px; background: var(--color-border); position: relative; z-index: 0;"></div>

      <!-- Point 5 — future dot (16px, border-only) -->
      <div style="flex: 1; display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; flex-shrink: 0;"></div>
      </div>

    </div>

    <!-- Labels below the line: points 2, 4 -->
    <div class="flex flex-row" style="align-items: flex-start; padding: 0 64px; margin-top: 0;">
      <!-- Point 1 spacer below -->
      <div style="flex: 1;"></div>
      <!-- Point 2 below -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 20px;">
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_2_label}}</span>
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_2_date}}</span>
      </div>
      <!-- Point 3 spacer below -->
      <div style="flex: 1;"></div>
      <!-- Point 4 below -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 20px;">
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_4_label}}</span>
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_4_date}}</span>
      </div>
      <!-- Point 5 spacer below -->
      <div style="flex: 1;"></div>
    </div>

  </div>
</div>

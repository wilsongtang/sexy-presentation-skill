<!-- Template: timeline-horizontal-reversed -->
<!-- Slots: title, point_1_date, point_1_label, point_2_date, point_2_label, point_3_date, point_3_label, point_4_date, point_4_label, point_5_date, point_5_label -->
<div class="slide" style="background-color: var(--color-primary);">
  <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap);">{{title}}</h2>

  <div class="flex flex-col" style="flex: 1; justify-content: center;">

    <!-- Labels above the line (points 1, 3, 5) -->
    <div class="flex flex-row" style="align-items: flex-end; padding: 0 48px; margin-bottom: 0;">
      <!-- Point 1 above -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 20px;">
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_1_date}}</span>
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_1_label}}</span>
      </div>
      <!-- Point 2 spacer above (label is below) -->
      <div style="flex: 1;"></div>
      <!-- Point 3 above -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 20px;">
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_3_date}}</span>
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_3_label}}</span>
      </div>
      <!-- Point 4 spacer above (label is below) -->
      <div style="flex: 1;"></div>
      <!-- Point 5 above -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 20px;">
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_5_date}}</span>
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_5_label}}</span>
      </div>
    </div>

    <!-- Horizontal connecting line + dot markers -->
    <div class="flex flex-row" style="align-items: center; padding: 0 48px; position: relative;">
      <!-- Continuous background line -->
      <div style="position: absolute; left: 48px; right: 48px; height: 3px; background: var(--color-border); top: 50%; transform: translateY(-50%);"></div>

      <!-- Point 1 dot -->
      <div style="flex: 1; display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 20px; height: 20px; border-radius: 50%; background: var(--color-accent); border: 3px solid var(--color-accent); box-shadow: 0 0 0 4px rgba(var(--color-accent), 0.15);"></div>
      </div>
      <!-- Connector segment -->
      <div style="flex: 1; height: 3px; background: var(--color-accent); position: relative; z-index: 0;"></div>
      <!-- Point 2 dot -->
      <div style="display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 20px; height: 20px; border-radius: 50%; background: var(--color-accent); border: 3px solid var(--color-accent);"></div>
      </div>
      <!-- Connector segment -->
      <div style="flex: 1; height: 3px; background: var(--color-border); position: relative; z-index: 0;"></div>
      <!-- Point 3 dot -->
      <div style="display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 20px; height: 20px; border-radius: 50%; background: var(--color-accent); border: 3px solid var(--color-accent);"></div>
      </div>
      <!-- Connector segment -->
      <div style="flex: 1; height: 3px; background: var(--color-border); position: relative; z-index: 0;"></div>
      <!-- Point 4 dot -->
      <div style="display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--color-border); background: white;"></div>
      </div>
      <!-- Connector segment -->
      <div style="flex: 1; height: 3px; background: var(--color-border); position: relative; z-index: 0;"></div>
      <!-- Point 5 dot -->
      <div style="flex: 1; display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--color-border); background: white;"></div>
      </div>
    </div>

    <!-- Labels below the line (points 2, 4) -->
    <div class="flex flex-row" style="align-items: flex-start; padding: 0 48px; margin-top: 0;">
      <!-- Point 1 spacer below (label is above) -->
      <div style="flex: 1;"></div>
      <!-- Point 2 below -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 20px;">
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_2_label}}</span>
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_2_date}}</span>
      </div>
      <!-- Point 3 spacer below -->
      <div style="flex: 1;"></div>
      <!-- Point 4 below -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 20px;">
        <span style="font-size: var(--size-body); font-weight: 600; color: var(--color-text-reversed); text-align: center;">{{point_4_label}}</span>
        <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); font-weight: 500;">{{point_4_date}}</span>
      </div>
      <!-- Point 5 spacer below -->
      <div style="flex: 1;"></div>
    </div>

  </div>
</div>

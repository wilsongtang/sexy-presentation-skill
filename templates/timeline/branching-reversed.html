<!-- Template: timeline-branching-reversed -->
<!-- Slots: title, before_label, before_description, decision_label, branch_a_label, branch_a_point_1, branch_a_point_2, branch_a_outcome, branch_b_label, branch_b_point_1, branch_b_point_2, branch_b_outcome -->
<div class="slide" style="background-color: var(--color-primary);">
  <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap);">{{title}}</h2>

  <div class="flex flex-row" style="flex: 1; align-items: stretch; gap: 0; overflow: hidden;">

    <!-- Left column: before the decision -->
    <div style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-right: 0;">
      <div style="text-align: center; padding: 0 24px;">
        <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-text-reversed); margin-bottom: 8px;">{{before_label}}</h3>
        <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.5;">{{before_description}}</p>
      </div>
    </div>

    <!-- Spine: vertical line + branch visual using SVG -->
    <div style="width: 320px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">

      <!-- Incoming horizontal connector from left -->
      <div style="position: absolute; left: 0; top: 50%; height: 3px; width: 48px; background: var(--color-border); transform: translateY(-50%);"></div>

      <!-- Decision diamond -->
      <div style="position: absolute; left: 48px; top: 50%; transform: translateY(-50%); width: 72px; height: 72px; background: var(--color-accent); rotate: 45deg; border-radius: 8px; z-index: 2;"></div>
      <div style="position: absolute; left: 48px; top: 50%; transform: translateY(-50%); width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; z-index: 3;">
        <span style="font-size: var(--size-caption); font-weight: 700; color: white; text-align: center; line-height: 1.2; padding: 0 8px;">{{decision_label}}</span>
      </div>

      <!-- Upper branch line going to top-right -->
      <svg style="position: absolute; left: 120px; top: 0; width: 200px; height: 50%; overflow: visible;" preserveAspectRatio="none">
        <path d="M 0 100% Q 40 100% 80 20%" stroke="var(--color-accent)" stroke-width="3" fill="none" />
        <line x1="80" y1="20%" x2="200" y2="20%" stroke="var(--color-accent)" stroke-width="3"/>
      </svg>

      <!-- Lower branch line going to bottom-right -->
      <svg style="position: absolute; left: 120px; bottom: 0; width: 200px; height: 50%; overflow: visible;">
        <path d="M 0 0 Q 40 0 80 80%" stroke="var(--color-border)" stroke-width="3" fill="none" />
        <line x1="80" y1="80%" x2="200" y2="80%" stroke="var(--color-border)" stroke-width="3"/>
      </svg>

      <!-- Branch A label tag (top) -->
      <div style="position: absolute; left: 148px; top: 18%; transform: translateY(-50%); background: var(--color-accent); border-radius: 6px; padding: 4px 10px; z-index: 4;">
        <span style="font-size: var(--size-caption); font-weight: 600; color: white;">{{branch_a_label}}</span>
      </div>

      <!-- Branch B label tag (bottom) -->
      <div style="position: absolute; left: 148px; bottom: 18%; transform: translateY(50%); background: var(--color-border); border-radius: 6px; padding: 4px 10px; z-index: 4;">
        <span style="font-size: var(--size-caption); font-weight: 600; color: rgba(255,255,255,0.6);">{{branch_b_label}}</span>
      </div>

    </div>

    <!-- Right column: two branch tracks -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 0; padding-left: 16px;">

      <!-- Branch A track (top half) -->
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; border-left: 3px solid var(--color-accent); padding-left: 24px; margin-bottom: 0;">
        <div style="display: flex; flex-direction: row; align-items: flex-start; gap: var(--gap); margin-bottom: 12px;">
          <div style="flex: 1;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
              <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0;"></div>
              <span style="font-size: var(--size-caption); color: var(--color-text-reversed); line-height: 1.4;">{{branch_a_point_1}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
              <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0;"></div>
              <span style="font-size: var(--size-caption); color: var(--color-text-reversed); line-height: 1.4;">{{branch_a_point_2}}</span>
            </div>
          </div>
          <div style="flex: 1; background: var(--color-accent); border-radius: 12px; padding: 14px 18px; opacity: 0.12; position: absolute; right: var(--margin); width: 280px;">
          </div>
        </div>
        <div style="background: var(--color-accent); border-radius: 10px; padding: 12px 18px; display: inline-block; max-width: 320px;">
          <span style="font-size: var(--size-caption); font-weight: 600; color: white;">{{branch_a_outcome}}</span>
        </div>
      </div>

      <!-- Divider between branches -->
      <div style="height: 1px; background: var(--color-border); margin: 4px 0;"></div>

      <!-- Branch B track (bottom half) -->
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; border-left: 3px solid var(--color-border); padding-left: 24px; margin-top: 0; opacity: 0.75;">
        <div style="margin-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.6); flex-shrink: 0;"></div>
            <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.4;">{{branch_b_point_1}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.6); flex-shrink: 0;"></div>
            <span style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.4;">{{branch_b_point_2}}</span>
          </div>
        </div>
        <div style="background: var(--color-border); border-radius: 10px; padding: 12px 18px; display: inline-block; max-width: 320px;">
          <span style="font-size: var(--size-caption); font-weight: 600; color: rgba(255,255,255,0.6);">{{branch_b_outcome}}</span>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- Template: timeline-vertical-light -->
<!-- Slots: title, point_1_date, point_1_title, point_1_body, point_2_date, point_2_title, point_2_body, point_3_date, point_3_title, point_3_body, point_4_date, point_4_title, point_4_body -->
<!-- Composition: Timeline Flow | Intensity: workhorse -->
<div class="slide" style="position: relative; overflow: hidden;">

  <!-- Motif: dot at top of timeline -->
  <div class="motif-element" style="position: absolute; left: var(--margin); top: -28px; width: 56px; height: 56px; border-radius: 50%; background: var(--color-accent); opacity: 0.12; pointer-events: none;"></div>

  <h2 style="font-size: var(--size-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div class="flex flex-row" style="flex: 1; gap: 0;">

    <!-- Vertical timeline spine -->
    <div style="display: flex; flex-direction: column; align-items: center; width: 40px; flex-shrink: 0;">
      <!-- Top cap line -->
      <div style="width: 3px; height: 12px; background: var(--color-border);"></div>
      <!-- Point 1 — active dot (20px, accent fill) -->
      <div style="width: 20px; height: 20px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; z-index: 1;"></div>
      <!-- Connector 1→2 -->
      <div style="flex: 1; width: 3px; background: var(--color-border);"></div>
      <!-- Point 2 — future dot (16px, border-only) -->
      <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; flex-shrink: 0; z-index: 1;"></div>
      <!-- Connector 2→3 -->
      <div style="flex: 1; width: 3px; background: var(--color-border);"></div>
      <!-- Point 3 — future dot (16px, border-only) -->
      <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; flex-shrink: 0; z-index: 1;"></div>
      <!-- Connector 3→4 -->
      <div style="flex: 1; width: 3px; background: var(--color-border);"></div>
      <!-- Point 4 — future dot (16px, border-only) -->
      <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); background: transparent; flex-shrink: 0; z-index: 1;"></div>
      <!-- Bottom cap line -->
      <div style="width: 3px; height: 12px; background: var(--color-border);"></div>
    </div>

    <!-- Content cards alternating left/right of the spine -->
    <div class="flex flex-col" style="flex: 1; justify-content: space-between; padding-left: 20px;">

      <!-- Point 1 — active, full row -->
      <div class="flex flex-row" style="align-items: flex-start; gap: var(--gap);">
        <div style="flex: 1; border-left: 3px solid var(--color-accent); padding: 4px 0 4px 16px;">
          <span style="font-size: var(--size-caption); color: var(--color-accent); font-weight: 600; display: block; margin-bottom: 4px;">{{point_1_date}}</span>
          <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-text); margin-bottom: 4px;">{{point_1_title}}</h3>
          <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5; margin: 0;">{{point_1_body}}</p>
        </div>
        <!-- Right spacer for alternating effect -->
        <div style="flex: 1;"></div>
      </div>

      <!-- Point 2 — future, right side -->
      <div class="flex flex-row" style="align-items: flex-start; gap: var(--gap);">
        <!-- Left spacer -->
        <div style="flex: 1;"></div>
        <div style="flex: 1; border-left: 3px solid var(--color-border); padding: 4px 0 4px 16px;">
          <span style="font-size: var(--size-caption); color: var(--color-muted); font-weight: 500; display: block; margin-bottom: 4px;">{{point_2_date}}</span>
          <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text); margin-bottom: 4px;">{{point_2_title}}</h3>
          <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5; margin: 0;">{{point_2_body}}</p>
        </div>
      </div>

      <!-- Point 3 — future, left side -->
      <div class="flex flex-row" style="align-items: flex-start; gap: var(--gap);">
        <div style="flex: 1; border-left: 3px solid var(--color-border); padding: 4px 0 4px 16px;">
          <span style="font-size: var(--size-caption); color: var(--color-muted); font-weight: 500; display: block; margin-bottom: 4px;">{{point_3_date}}</span>
          <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text); margin-bottom: 4px;">{{point_3_title}}</h3>
          <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5; margin: 0;">{{point_3_body}}</p>
        </div>
        <div style="flex: 1;"></div>
      </div>

      <!-- Point 4 — future, right side -->
      <div class="flex flex-row" style="align-items: flex-start; gap: var(--gap);">
        <div style="flex: 1;"></div>
        <div style="flex: 1; border-left: 3px solid var(--color-border); padding: 4px 0 4px 16px;">
          <span style="font-size: var(--size-caption); color: var(--color-muted); font-weight: 500; display: block; margin-bottom: 4px;">{{point_4_date}}</span>
          <h3 style="font-size: var(--size-body); font-weight: 600; color: var(--color-text); margin-bottom: 4px;">{{point_4_title}}</h3>
          <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5; margin: 0;">{{point_4_body}}</p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Template: timeline-branching-light -->
<!-- Slots: title, trunk, branch_1_label, branch_1_items, branch_2_label, branch_2_items -->
<!-- Composition: Timeline Flow | Intensity: workhorse -->
<div class="slide" style="position: relative; overflow: hidden;">

  <!-- Motif: dot at bottom -->
  <div class="motif-element" style="position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--color-accent); opacity: 0.15; pointer-events: none;"></div>

  <h2 style="font-size: var(--size-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap);">{{title}}</h2>

  <div class="flex flex-row" style="flex: 1; align-items: stretch; gap: 0;">

    <!-- Left: trunk label card -->
    <div style="width: 200px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-right: 0;">
      <div style="border: 1px solid var(--color-border); border-radius: 12px; padding: 20px 24px; text-align: center; width: 100%;">
        <p style="font-size: var(--size-body); font-weight: 600; color: var(--color-text); line-height: 1.4; margin: 0;">{{trunk}}</p>
      </div>
    </div>

    <!-- Center: trunk vertical line + split to horizontal branches -->
    <div style="width: 120px; flex-shrink: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;">

      <!-- Trunk horizontal connector from card to center -->
      <div style="position: absolute; left: 0; width: 30px; height: 3px; background: var(--color-border); top: 50%; transform: translateY(-50%);"></div>

      <!-- Trunk dot (accent, at branch point) -->
      <div style="position: absolute; left: 30px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--color-accent); z-index: 2;"></div>

      <!-- Vertical spine from branch-point up to branch 1 -->
      <div style="position: absolute; left: 37px; top: 0; height: 50%; width: 3px; background: var(--color-border); z-index: 1;"></div>

      <!-- Vertical spine from branch-point down to branch 2 -->
      <div style="position: absolute; left: 37px; top: 50%; height: 50%; width: 3px; background: var(--color-border); z-index: 1;"></div>

      <!-- Branch 1 horizontal line to right -->
      <div style="position: absolute; left: 37px; top: 25%; width: 83px; height: 3px; background: var(--color-border); z-index: 1;"></div>

      <!-- Branch 1 accent dot at right end -->
      <div style="position: absolute; right: 0; top: 25%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--color-accent); z-index: 2;"></div>

      <!-- Branch 2 horizontal line to right -->
      <div style="position: absolute; left: 37px; top: 75%; width: 83px; height: 3px; background: var(--color-border); z-index: 1;"></div>

      <!-- Branch 2 accent dot at right end -->
      <div style="position: absolute; right: 0; top: 75%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--color-accent); z-index: 2;"></div>

    </div>

    <!-- Right: two branch content areas -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">

      <!-- Branch 1 card -->
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; border: 2px solid var(--color-accent); border-radius: 12px; padding: 20px 24px;">
        <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-accent); margin-bottom: 8px; line-height: 1.3;">{{branch_1_label}}</h3>
        <p style="font-size: var(--size-caption); color: var(--color-text); line-height: 1.5; margin: 0;">{{branch_1_items}}</p>
      </div>

      <!-- Branch 2 card -->
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--color-border); border-radius: 12px; padding: 20px 24px;">
        <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-text); margin-bottom: 8px; line-height: 1.3;">{{branch_2_label}}</h3>
        <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5; margin: 0;">{{branch_2_items}}</p>
      </div>

    </div>
  </div>
</div>

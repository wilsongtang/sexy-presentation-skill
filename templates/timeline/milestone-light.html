<!-- Template: timeline-milestone-light -->
<!-- Slots: title, milestone_1_number, milestone_1_title, milestone_1_description, milestone_2_number, milestone_2_title, milestone_2_description, milestone_3_number, milestone_3_title, milestone_3_description -->
<div class="slide">
  <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap);">{{title}}</h2>

  <div class="flex flex-col" style="flex: 1; justify-content: center;">

    <!-- Path + milestone markers row -->
    <div class="flex flex-row" style="align-items: center; padding: 0 80px; position: relative; margin-bottom: 40px;">

      <!-- Connecting path line (behind circles) -->
      <div style="position: absolute; left: 80px; right: 80px; height: 4px; background: var(--color-border); top: 50%; transform: translateY(-50%); z-index: 0;"></div>

      <!-- Milestone 1 -->
      <div style="flex: 1; display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 96px; height: 96px; border-radius: 50%; background: var(--color-accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.12);">
          <span style="font-size: var(--size-title); font-weight: 700; color: white; line-height: 1;">{{milestone_1_number}}</span>
        </div>
      </div>

      <!-- Completed segment -->
      <div style="flex: 1; height: 4px; background: var(--color-accent); position: relative; z-index: 0;"></div>

      <!-- Milestone 2 -->
      <div style="display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 96px; height: 96px; border-radius: 50%; background: var(--color-primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(0,0,0,0.12);">
          <span style="font-size: var(--size-title); font-weight: 700; color: white; line-height: 1;">{{milestone_2_number}}</span>
        </div>
      </div>

      <!-- Upcoming segment -->
      <div style="flex: 1; height: 4px; background: var(--color-border); position: relative; z-index: 0;"></div>

      <!-- Milestone 3 -->
      <div style="flex: 1; display: flex; justify-content: center; position: relative; z-index: 1;">
        <div style="width: 96px; height: 96px; border-radius: 50%; background: white; border: 3px solid var(--color-border); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06);">
          <span style="font-size: var(--size-title); font-weight: 700; color: var(--color-muted); line-height: 1;">{{milestone_3_number}}</span>
        </div>
      </div>

    </div>

    <!-- Milestone labels row -->
    <div class="flex flex-row" style="padding: 0 80px;">

      <!-- Milestone 1 label -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 0 24px;">
        <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-text);">{{milestone_1_title}}</h3>
        <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5;">{{milestone_1_description}}</p>
      </div>

      <!-- Milestone 2 label -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 0 24px;">
        <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-text);">{{milestone_2_title}}</h3>
        <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5;">{{milestone_2_description}}</p>
      </div>

      <!-- Milestone 3 label -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 0 24px;">
        <h3 style="font-size: var(--size-body); font-weight: 700; color: var(--color-muted);">{{milestone_3_title}}</h3>
        <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: 1.5; opacity: 0.7;">{{milestone_3_description}}</p>
      </div>

    </div>

  </div>
</div>

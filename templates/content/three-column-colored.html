<!-- Template: content-three-column-colored -->
<!-- Slots: title, column_1, column_2, column_3 -->
<div class="slide" style="background-color: var(--color-secondary);">
  <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap);">{{title}}</h2>
  <div class="flex flex-row" style="gap: var(--gap); flex: 1;">
    <div style="flex: 1; font-size: var(--size-body); line-height: var(--line-height);">{{column_1}}</div>
    <div style="flex: 1; font-size: var(--size-body); line-height: var(--line-height);">{{column_2}}</div>
    <div style="flex: 1; font-size: var(--size-body); line-height: var(--line-height);">{{column_3}}</div>
  </div>
</div>

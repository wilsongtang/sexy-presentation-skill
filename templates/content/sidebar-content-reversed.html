<!-- Template: content-sidebar-content-reversed -->
<!-- Slots: title, body, sidebar -->
<!-- Composition: Asymmetric Split | Intensity: workhorse -->
<div class="slide" style="background-color: var(--color-primary); position: relative; overflow: hidden; display: flex; flex-direction: row; padding: 0;">
  <!-- Main content panel (65%) -->
  <div style="flex: 65; padding: var(--margin); display: flex; flex-direction: column; justify-content: center; position: relative;">
    <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text-reversed); margin-bottom: var(--gap); letter-spacing: -0.01em;">
      {{title}}
    </h2>
    <div style="font-size: var(--size-body); line-height: var(--line-height); color: var(--color-text-reversed);">
      {{body}}
    </div>
  </div>

  <!-- Sidebar panel (35%) -->
  <div style="flex: 35; padding: var(--margin); display: flex; flex-direction: column; justify-content: flex-start; position: relative; background: rgba(var(--color-accent-rgb, 0, 0, 0), 0.03); border-left: 1px solid var(--color-border);">
    <!-- Motif: dot at top of sidebar -->
    <div class="motif-element motif-dot" style="position: absolute; top: var(--margin); right: var(--margin);"></div>
    <!-- 4px accent top stripe -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--color-accent);"></div>

    <div style="font-size: var(--size-body); line-height: var(--line-height); color: rgba(255,255,255,0.6); margin-top: calc(var(--gap) * 0.5);">
      {{sidebar}}
    </div>
  </div>
</div>

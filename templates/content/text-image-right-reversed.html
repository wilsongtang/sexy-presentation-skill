<!-- Template: content-text-image-right-reversed -->
<!-- Slots: title, body, image -->
<div class="slide" style="background-color: var(--color-primary); !p-0 flex-row">
  <div style="width: 55%; padding: var(--margin); display: flex; flex-direction: column; justify-content: center;">
    <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap);">{{title}}</h2>
    <div style="font-size: var(--size-body); line-height: var(--line-height); max-width: 900px;">
      {{body}}
    </div>
  </div>
  <div style="width: 45%; height: 100%; overflow: hidden;">
    <img src="{{image}}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
  </div>
</div>

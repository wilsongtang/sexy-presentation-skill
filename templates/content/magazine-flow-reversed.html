<!-- Template: content-magazine-flow-reversed -->
<!-- Slots: title, body, pull_quote -->
<div class="slide" style="background-color: var(--color-primary);">
  <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap);">{{title}}</h2>
  <div class="flex flex-row" style="gap: var(--gap); flex: 1;">
    <div style="flex: 1; font-size: var(--size-body); line-height: var(--line-height);">
      {{body}}
    </div>
    <div style="flex: 1; display: flex; align-items: center; padding-left: var(--gap);">
      <blockquote style="font-size: var(--size-header); font-style: italic; line-height: 1.4; color: var(--color-primary); border-left: 4px solid var(--color-accent); padding-left: 32px;">
        {{pull_quote}}
      </blockquote>
    </div>
  </div>
</div>

<!-- Template: content-card-layout-reversed -->
<!-- Slots: title, card_1_title, card_1_body, card_2_title, card_2_body, card_3_title, card_3_body -->
<div class="slide" style="background-color: var(--color-primary);">
  <h2 style="font-size: var(--size-header); font-weight: 600; margin-bottom: var(--gap);">{{title}}</h2>
  <div class="flex flex-row" style="gap: var(--gap); flex: 1; align-items: stretch;">
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.15; flex-shrink: 0;"></div>
      <h3 style="font-size: var(--size-body); font-weight: 600;">{{card_1_title}}</h3>
      <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.6;">{{card_1_body}}</p>
    </div>
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.15; flex-shrink: 0;"></div>
      <h3 style="font-size: var(--size-body); font-weight: 600;">{{card_2_title}}</h3>
      <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.6;">{{card_2_body}}</p>
    </div>
    <div style="flex: 1; border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.15; flex-shrink: 0;"></div>
      <h3 style="font-size: var(--size-body); font-weight: 600;">{{card_3_title}}</h3>
      <p style="font-size: var(--size-caption); color: rgba(255,255,255,0.6); line-height: 1.6;">{{card_3_body}}</p>
    </div>
  </div>
</div>

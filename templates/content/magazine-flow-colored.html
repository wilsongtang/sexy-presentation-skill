<!-- Template: content-magazine-flow-colored -->
<!-- Slots: title, body, pull_quote -->
<!-- Composition: Magazine Flow | Intensity: impact -->
<div class="slide" style="background-color: var(--color-secondary); position: relative; overflow: hidden; display: flex; flex-direction: column; padding: var(--margin);">
  <!-- Motif: vertical line bottom-right -->
  <div class="motif-element motif-vline" style="position: absolute; bottom: var(--margin); right: calc(var(--margin) + 20px);"></div>

  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap); letter-spacing: -0.01em;">
    {{title}}
  </h2>

  <div style="display: flex; flex-direction: row; gap: calc(var(--gap) * 1.5); flex: 1; align-items: stretch;">
    <!-- Main column (60%): body text -->
    <div style="flex: 60; font-size: var(--size-body); line-height: 1.7; color: var(--color-text);">
      {{body}}
    </div>
    <!-- Column divider -->
    <div style="width: 1px; background: var(--color-border); flex-shrink: 0; align-self: stretch;"></div>
    <!-- Side column (40%): dominant pull quote -->
    <div style="flex: 40; display: flex; align-items: center;">
      <blockquote style="font-family: var(--font-header); font-size: var(--size-header); font-style: italic; color: var(--color-accent); line-height: 1.4; border-left: 4px solid var(--color-accent); padding-left: 28px; margin: 0;">
        {{pull_quote}}
      </blockquote>
    </div>
  </div>
</div>

<!-- Template: content-icon-grid-2x2-colored -->
<!-- Slots: title, icon_1_title, icon_1_body, icon_2_title, icon_2_body, icon_3_title, icon_3_body, icon_4_title, icon_4_body -->
<!-- Composition: Card Grid | Intensity: workhorse -->
<div class="slide" style="background-color: var(--color-secondary); position: relative; overflow: hidden; display: flex; flex-direction: column; padding: var(--margin);">
  <!-- Motif: dot bottom-right -->
  <div class="motif-element motif-dot" style="position: absolute; bottom: calc(var(--margin) + 8px); right: calc(var(--margin) + 8px);"></div>

  <h2 style="font-size: var(--size-header); font-family: var(--font-header); font-weight: 600; color: var(--color-text); margin-bottom: var(--gap); letter-spacing: -0.01em;">
    {{title}}
  </h2>

  <div style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: var(--gap); flex: 1;">
    <!-- Card 1: dominant — accent border -->
    <div style="border: 2px solid var(--color-accent); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.15; flex-shrink: 0;"></div>
      <h3 style="font-size: var(--size-body); font-family: var(--font-header); font-weight: 600; color: var(--color-text);">{{icon_1_title}}</h3>
      <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height);">{{icon_1_body}}</p>
    </div>
    <!-- Card 2 -->
    <div style="border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.08; flex-shrink: 0;"></div>
      <h3 style="font-size: var(--size-body); font-family: var(--font-header); font-weight: 600; color: var(--color-text);">{{icon_2_title}}</h3>
      <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height);">{{icon_2_body}}</p>
    </div>
    <!-- Card 3 -->
    <div style="border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.08; flex-shrink: 0;"></div>
      <h3 style="font-size: var(--size-body); font-family: var(--font-header); font-weight: 600; color: var(--color-text);">{{icon_3_title}}</h3>
      <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height);">{{icon_3_body}}</p>
    </div>
    <!-- Card 4 -->
    <div style="border: 1px solid var(--color-border); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--color-accent); opacity: 0.08; flex-shrink: 0;"></div>
      <h3 style="font-size: var(--size-body); font-family: var(--font-header); font-weight: 600; color: var(--color-text);">{{icon_4_title}}</h3>
      <p style="font-size: var(--size-caption); color: var(--color-muted); line-height: var(--line-height);">{{icon_4_body}}</p>
    </div>
  </div>
</div>
